<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หน้าหลัก – Smart Lost &amp; Found</title>
<meta name="description" content="เว็บแจ้งของหาย/ของที่เก็บได้ สำหรับนักศึกษา มศว">
<meta name="theme-color" content="#2f6fe4">
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27&gt;&lt;text y=%27.9em%27 font-size=%2790%27&gt;%F0%9F%8E%92&lt;/text&gt;&lt;/svg&gt;">
<link href="./css2" rel="stylesheet">
<style>
:root{--b:#2f6fe4;--b2:#1d4fb8;--bl:#e8f1ff;--bl2:#d3e5ff;--bg:#eef5ff;--tx:#17325c;--mu:#6a82a8;--ln:#d6e4fa;--w:#fff;--rd:#e5484d;--gr:#1fa971;--am:#f0a020;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px 'Prompt',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px}
@media(min-width:700px){body{background:linear-gradient(135deg,#cfe2ff,#eaf3ff)}#app{margin:20px auto;min-height:calc(100vh - 40px);border-radius:28px;box-shadow:0 20px 60px #2f6fe433;overflow:hidden}}
.bar{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:var(--w);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}
.bar h2{font-size:17px;font-weight:600;flex:1}.ib{border:0;background:var(--bl);color:var(--b);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer;position:relative}
.dot{position:absolute;top:5px;right:6px;width:9px;height:9px;background:var(--rd);border-radius:50%}
main{padding:14px}
.card{background:var(--w);border:1px solid var(--ln);border-radius:18px;padding:12px;margin-bottom:12px}
.in,select,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--w);color:var(--tx);font:inherit}
label.l{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}label.l i{color:var(--rd);font-style:normal}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--b);color:#fff;font:inherit;font-weight:500;cursor:pointer;text-align:center;margin-top:12px}
.btn.o{background:var(--w);color:var(--b);border:1.5px solid var(--b)}.btn.g{background:var(--gr)}
.seg{display:flex;background:var(--bl2);border-radius:14px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:12px;font:inherit;color:var(--b);cursor:pointer}.seg .on{background:var(--b);color:#fff}
.tag{display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:99px;font-weight:500}.t-lost{background:#ffe5e6;color:var(--rd)}.t-found{background:#dcf7ea;color:var(--gr)}.t-done{background:var(--bl2);color:var(--mu)}
.it{display:flex;gap:12px;align-items:center;cursor:pointer}.th{width:68px;height:68px;border-radius:14px;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;object-fit:cover}
.it h3{font-size:15px;font-weight:500;margin:3px 0}.mu{font-size:12.5px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.cat{text-align:center;font-size:11.5px;cursor:pointer;border:0;background:none;color:var(--tx);font-family:inherit}.cat span{display:flex;width:52px;height:52px;margin:0 auto 4px;border-radius:16px;background:var(--bl2);align-items:center;justify-content:center;font-size:24px}.cat.on span{background:var(--b)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-weight:600}.hd a{font-size:13px;color:var(--b);font-weight:400;cursor:pointer}
.ban{background:linear-gradient(135deg,var(--b),#5b9bff);color:#fff;border-radius:18px;padding:14px;margin-top:12px}.ban b{display:block;margin-bottom:4px}.ban small{opacity:.9}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--w);border-top:1px solid var(--ln);display:flex;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}

/* auth: รหัสผ่านถูกแฮช SHA-256 + salt ก่อนเก็บ (เก็บในเบราว์เซอร์เท่านั้น) */

const sU=u=>{try{localStorage.setItem('slf_users',JSON.stringify(u))}catch(e){toast('บันทึกบัญชีไม่ได้')}};
async function hp(p,salt){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const rs=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
const er=m=>{const e=$('#err');if(e)e.textContent=m};
async function doLogin(m){
if(m===2){toast('ล็อกอินด้วย Google / Apple / มศว ต้องมีเซิร์ฟเวอร์ ยังไม่เปิดใช้ในเวอร์ชันนี้');return}
if(!(window.crypto&&crypto.subtle))return er('เบราว์เซอร์นี้ไม่รองรับการเข้ารหัส กรุณาเปิดผ่าน https');
const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,u=U();

if(nm.length<2)return er('กรอกชื่อ-นามสกุล');
if(pw.length<8)return er('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
if(pw!==$('#pw2').value)return er('รหัสผ่านไม่ตรงกัน');
if(u[em])return er('อีเมลนี้สมัครแล้ว กรุณาเข้าสู่ระบบ');
const salt=rs();u[em]={name:nm,salt,hash:await hp(pw,salt)};sU(u)}
else{const a=u[em];if(!a||a.hash!==await hp(pw,a.salt))return er('อีเมลหรือรหัสผ่านไม่ถูกต้อง')}
S.user={name:u[em].name,email:em,av:u[em].av||''};save();toast('ยินดีต้อนรับ '+u[em].name);location.hash='home'}

function listHome(){const w=q.toLowerCase().split(/\s+/).filter(Boolean);const a=S.items.filter(i=>(fc<0||i.cat===fc)&&w.every(x=>(i.title+i.desc+i.place+CATS[i.cat][1]).toLowerCase().includes(x))).sort((a,b)=>(a.st==='done')-(b.st==='done')||b.d-a.d);return a.length?a.map(itemRow).join(''):'<div class="mu" style="text-align:center;padding:30px">ไม่พบรายการ ลองเปลี่ยนคำค้นหา หรือประกาศใหม่</div>'}

/* 3 post */
function post(){return`${bar('ประกาศ / สร้างโพสต์')}<main><div class="seg"><button class="${F.type==='lost'?'on':''}" onclick="sf();F.type='lost';render()">ประกาศของหาย</button><button class="${F.type==='found'?'on':''}" onclick="sf();F.type='found';render()">ประกาศของที่เก็บได้</button></div>
<label class="l">เพิ่มรูปภาพ</label><div class="up"><label><i>📷</i>ถ่ายรูป / เลือกรูป<input type="file" accept="image/*" capture="environment" hidden onchange="pk(this)"></label><label><i>⬆️</i>อัปโหลด<input type="file" accept="image/*" hidden onchange="pk(this)"></label></div>${F.img?`<img src="${F.img}" alt="" style="width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-top:8px">`:''}
<label class="l">หมวดหมู่ <i>*</i></label><select id="cat"><option value="">เลือกหมวดหมู่</option>${CATS.map((c,i)=>`<option value="${i}" ${F.cat==i&&F.cat!==''?'selected':''}>${c[0]} ${c[1]}</option>`).join('')}</select>
<label class="l">ชื่อสิ่งของ <i>*</i></label><input class="in" id="title" placeholder="เช่น กระเป๋าสตางค์สีดำ" value="${esc(F.title)}">
<label class="l">รายละเอียดของสิ่งของ <i>*</i></label><textarea id="desc" rows="3" placeholder="สี ยี่ห้อ ลักษณะเด่น">${esc(F.desc)}</textarea>
<label class="l">สถานที่ที่พบ <i>*</i></label><select id="place"><option value="">เลือกสถานที่</option>${Object.keys(PL).map(p=>`<option ${F.place===p?'selected':''}>${p}</option>`).join('')}</select>
<label class="l">วันที่พบ <i>*</i></label><div class="up"><input class="in" type="date" id="date" value="${F.date}"><input class="in" type="time" id="time" value="${F.time}"></div>
<label class="l">ช่องทางติดต่อ (ถ้ามี)</label><input class="in" id="contact" placeholder="เบอร์โทร / Line / อื่นๆ" value="${esc(F.contact)}"><button class="btn" onclick="submitPost()">โพสต์ประกาศ</button></main>`}
function sf(){['cat','title','desc','place','date','time','contact'].forEach(k=>{const e=$('#'+k);if(e)F[k]=e.value})}
function pk(i){if(!i.files[0])return;sf();readImg(i.files[0],d=>{F.img=d;render()})}
function submitPost(){sf();if(F.cat===''||!F.title||!F.desc||!F.place||!F.date){toast('กรอกข้อมูลที่มี * ให้ครบ');return}
if(new Date(F.date+'T'+(F.time||'00:00'))>new Date()){toast('วันที่พบต้องไม่เป็นอนาคต');return}
const t=new Date(F.date+'T'+(F.time||'12:00')).getTime();const it={id:newId(),type:F.type,cat:+F.cat,title:F.title,desc:F.desc,place:F.place,d:t,contact:F.contact||'ติดต่อผ่านแชท',by:(S.user&&S.user.name)||'นักศึกษา ก.',st:'open',img:F.img,mine:1,owner:S.user.email};S.items.unshift(it);dbw(it.id,r=>r.set(it));save();F={type:F.type,cat:'',title:'',desc:'',place:'',date:'',time:'',contact:'',img:''};toast('โพสต์เรียบร้อย ✓');location.hash='item-'+it.id}

/* 4 item */
function item(id){const i=get(id);if(!i)return bar('ไม่พบรายการ',1)+'<main class="mu">รายการนี้ถูกลบแล้ว</main>';const sv=S.saved.includes(i.id),own=i.owner===(S.user&&S.user.email);
const sim=S.items.filter(o=>o.id!==i.id&&o.type!==i.type&&o.st==='open'&&(o.cat===i.cat||o.place===i.place)).slice(0,2);
return`<div class="hero" ${i.img?`style="background-image:url(${i.img})"`:''}>${i.img?'':CATS[i.cat][0]}<button class="ib" style="position:absolute;top:14px;left:14px" onclick="history.back()">‹</button></div><main>
<h2 style="font-size:20px;font-weight:600">${esc(i.title)} ${tag(i)}</h2>
<div class="row"><b>📂 หมวดหมู่</b>${CATS[i.cat][1]}</div><div class="row"><b>🕒 วันที่พบ</b>${fd(i.d)} เวลา ${ft(i.d)} น.</div><div class="row"><b>📍 สถานที่พบ</b>${PL[i.place]?`<a style="color:var(--b);cursor:pointer" onclick="msel='${i.place}';location.hash='map'">${esc(i.place)} · ดูบนแผนที่</a>`:esc(i.place)}</div>
<div class="card" style="margin-top:10px"><b>รายละเอียดเพิ่มเติม</b><p class="mu" style="margin-top:6px">${esc(i.desc)}</p></div>
<div class="card it"><div class="th" style="border-radius:50%">👤</div><div><b>ผู้ประกาศ</b><div class="mu">${esc(i.by)} · นักศึกษา มศว${own&&S.verified.id?' · ✅ ยืนยันตัวตนแล้ว':''}</div><div class="mu">ติดต่อ: ${esc(i.contact)}</div></div></div>
${sim.length?`<div class="hd">✨ รายการที่อาจตรงกัน</div>${sim.map(itemRow).join('')}`:''}
<div class="up"><button class="btn" onclick="location.hash='chat-${i.id}'">💬 ติดต่อผู้ประกาศ</button><button class="btn o" onclick="tsv(${i.id})">${sv?'💙 บันทึกแล้ว':'🤍 บันทึก'}</button></div>
${own&&i.st==='open'?`<button class="btn g" onclick="dn(${i.id})">${i.type==='lost'?'ได้ของคืนแล้ว':'ส่งคืนเจ้าของแล้ว'}</button>`:''}
${own?`<button class="btn o" style="color:var(--rd);border-color:var(--rd)" onclick="rm(${i.id})">ลบประกาศ</button>`:''}</main>`}
function tsv(id){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];save();render()}
function dn(id){get(id).st='done';dbw(id,r=>r.update({st:'done'}));save();toast('ปิดประกาศแล้ว 🎉');render()}
function rm(id){if(!confirm('ลบประกาศนี้?'))return;dbw(id,r=>r.delete());S.items=S.items.filter(i=>i.id!==id);save();location.hash='home'}

/* 5 chat */
function chat(id){const i=get(id);if(!i)return'';const m=S.chats[id]||(S.chats[id]=[{w:'o',t:'สวัสดีค่ะ ยังอยู่ไหมคะ เรื่อง'+i.title}]);
return`${bar(esc(i.by),1)}<div class="card it" style="margin:10px 14px 0" onclick="location.hash='item-${i.id}'">${thumb(i)}<div><b>${esc(i.title)}</b><div class="mu">พบที่: ${esc(i.place)}</div></div></div>
<div class="msgs" id="ms">${m.map(x=>`<div class="m ${x.w}">${esc(x.t)}</div>`).join('')}</div>
<div class="cb"><input class="in" id="cmsg" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key==='Enter')send(${id})"><button class="ib" style="background:var(--b);color:#fff" onclick="send(${id})">➤</button></div>`}
function send(id){const e=$('#cmsg'),t=e.value.trim();if(!t)return;S.chats[id].push({w:'me',t});save();render();setTimeout(()=>{S.chats[id].push({w:'o',t:'ได้ค่ะ นัดรับที่จุดบริการนิสิตหรือห้องสมุดได้ไหมคะ'});save();if(location.hash==='#chat-'+id)render()},700)}

/* 6 map */
const KC={a:'#d3e5ff',s:'#dcf7ea',f:'#ffe9c2',p:'#e6eaf2',g:'#ffdede'},gm=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('มศว ประสานมิตร '+q);
const MB=`<rect width="400" height="290" fill="#eef3fb"/><rect width="400" height="24" fill="#bcd8f7"/><text x="200" y="16" text-anchor="middle" font-size="9.5" fill="#2f5d9f">คลองแสนแสบ</text><rect x="26" y="34" width="348" height="246" rx="14" fill="#e3f3e8" stroke="#9fd0b0"/><path d="M34 101H366M34 163H366M34 225H366M148 40V274M252 40V274" stroke="#fff" stroke-width="7" stroke-linecap="round"/><rect y="24" width="20" height="266" fill="#fff"/><rect x="380" y="24" width="20" height="266" fill="#fff"/><text transform="translate(13 157) rotate(-90)" text-anchor="middle" font-size="8.5" fill="#6a82a8">ถ.อโศกมนตรี (ซอย 21)</text><text transform="translate(393 157) rotate(-90)" text-anchor="middle" font-size="8.5" fill="#6a82a8">ซอยสุขุมวิท 23</text>`;
function map(){const cnt=p=>S.items.filter(i=>i.place===p&&i.st==='open').length,sh=msel?S.items.filter(i=>i.place===msel&&i.st==='open'):[];
const pins=Object.entries(PL).map(([p,[x,y,e,k]])=>{const n=cnt(p),on=msel===p;return`<g onclick="msel='${p}';render()" style="cursor:pointer"><rect x="${x-44}" y="${y-19}" width="88" height="38" rx="9" fill="${KC[k]}" stroke="${on?'#e5484d':'#2f6fe4'}" stroke-width="${on?3:1}"/><text x="${x}" y="${y-3}" text-anchor="middle" font-size="14">${e}</text><text x="${x}" y="${y+12}" text-anchor="middle" font-size="9" fill="#17325c">${p}</text>${n?`<circle cx="${x+42}" cy="${y-17}" r="9" fill="#e5484d"/><text x="${x+42}" y="${y-13.5}" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">${n}</text>`:''}</g>`}).join('');
return`${bar('แผนที่ มศว ประสานมิตร')}<main><div class="card" style="padding:6px"><svg class="map" viewBox="0 0 400 290" role="img" aria-label="แผนผังมหาวิทยาลัย">${MB}${pins}</svg></div>
<a class="btn o" style="margin-top:0" href="https://www.google.com/maps/@13.7469129,100.5656555,18.68z" target="_blank" rel="noopener">🗺️ เปิดแผนที่จริงใน Google Maps</a><p class="mu" style="margin:8px 2px">แผนผังนี้เป็นภาพประกอบ ตำแหน่งอาคารโดยประมาณ หากต้องการนำทางจริงให้กด “นำทาง” ที่สถานที่นั้น</p>
${msel?`<div class="hd">${msel}</div><div class="up"><a class="btn" style="margin:0" onclick="F.place=msel;location.hash='post'">➕ ประกาศที่นี่</a><a class="btn o" style="margin:0" href="${gm(msel)}" target="_blank" rel="noopener">🧭 นำทาง</a></div>${sh.length?sh.map(itemRow).join(''):'<p class="mu" style="margin-top:10px">ยังไม่มีรายการที่ยังเปิดอยู่ในบริเวณนี้</p>'}`:'<p class="mu" style="margin-top:6px">แตะอาคารบนแผนที่เพื่อดูรายการที่พบในบริเวณนั้น (ตัวเลขสีแดง = จำนวนรายการ)</p>'}
<div class="hd">สถานที่ทั้งหมด</div>${Object.entries(PL).map(([p,v])=>`<div class="card" onclick="msel='${p}';render();window.scrollTo(0,0)" style="cursor:pointer">${v[2]} ${p} <span class="mu">· ${cnt(p)} รายการ</span></div>`).join('')}</main>`}

/* 7 calendar */
function cal(){const y=cm.getFullYear(),mo=cm.getMonth(),first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate(),has=new Set(S.items.map(i=>dk(i.d)));let c=['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="h">${d}</div>`).join('')+'<span></span>'.repeat(first);
for(let d=1;d<=dim;d++){const k=y+'-'+(mo+1)+'-'+d;c+=`<button class="${has.has(k)?'has':''} ${k===cs?'sel':''} ${k===dk(now)?'td':''}" onclick="cs='${k}';render()">${d}</button>`}
const dl=S.items.filter(i=>dk(i.d)===cs);return`${bar('ปฏิทินตามหาของ')}<main><div class="card"><div class="hd" style="margin-top:0"><button class="ib" onclick="cm=new Date(${y},${mo-1},1);render()">‹</button>${fd(cm,{month:'long',year:'numeric'})}<button class="ib" onclick="cm=new Date(${y},${mo+1},1);render()">›</button></div><div class="cal">${c}</div><p class="mu" style="margin-top:8px">🟠 มีรายการของหาย/ของที่เก็บได้</p></div>
<div class="hd">รายการตามหาวันนี้ <a onclick="location.hash='event-${cs}'">ดูทั้งหมด</a></div>${dl.length?dl.map(itemRow).join(''):'<p class="mu">ไม่มีรายการในวันที่เลือก</p>'}</main>`}
/* 8 day detail */
function event(k){const [y,m,d]=k.split('-').map(Number),dl=S.items.filter(i=>dk(i.d)===k);return`${bar('กิจกรรมตามหาของ',1)}<main><div class="card"><b>📅 ${fd(new Date(y,m-1,d),{day:'numeric',month:'long',year:'numeric'})}</b><div class="mu" style="margin-top:4px">ของที่เกี่ยวข้อง (${dl.length} รายการ)</div></div>${dl.length?dl.map(itemRow).join(''):'<p class="mu">ยังไม่มีรายการในวันนี้</p>'}</main>`}

/* 9 scan */
function scan(){return`<div class="scan"><div class="bar" style="background:none;border:0"><button class="ib" onclick="history.back()">‹</button><h2>สแกนรูปเพื่อค้นหา</h2></div><div class="vf" ${scanImg?`style="background-image:url(${scanImg})"`:''}>${scanImg?'':'📷'}</div>
<p class="mu" style="text-align:center;color:#9fc0f5">ถ่ายหรือเลือกรูปสิ่งของ เพื่อดูรายการที่คล้ายกัน</p>
<div class="sc"><label><i>🖼️</i>แกลเลอรี<input type="file" accept="image/*" hidden onchange="sp(this)"></label><label class="shut" style="display:block"><input type="file" accept="image/*" capture="environment" hidden onchange="sp(this)"></label><button onclick="toast('ไฟแฟลชขึ้นอยู่กับอุปกรณ์')"><i>⚡</i>แฟลช</button></div>
${scanImg?'<div style="padding:0 20px"><button class="btn" onclick="scanRes()">ค้นหาของที่คล้ายกัน</button></div>':''}</div>`}
function sp(i){if(i.files[0])readImg(i.files[0],d=>{scanImg=d;render()})}
function scanRes(){const r=S.items.filter(i=>i.st==='open').slice(0,3);const e=document.createElement('div');e.className='sheet';e.onclick=x=>{if(x.target===e)e.remove()};e.innerHTML=`<div><div class="hd" style="margin-top:0">ผลการค้นหา (ตัวอย่างเดโม)</div><p class="mu" style="margin-bottom:10px">เวอร์ชันนี้ยังไม่ได้เชื่อม AI วิเคราะห์ภาพจริง จึงแสดงรายการล่าสุดเป็นตัวอย่าง</p>${r.map((i,n)=>itemRow(i).replace('</h3>',`</h3><span class="mu">ความคล้าย ${90-n*12}%</span>`)).join('')}</div>`;document.body.appendChild(e)}

/* 10 profile */
function me(){const u=S.user||{name:'นักศึกษา ก.',email:'student@g.swu.ac.th'},mine=S.items.filter(i=>i.mine);return`${bar('โปรไฟล์ / ประวัติประกาศ',0,'<button class="ib" onclick="location.hash=\'prefs\'">⚙️</button>')}<main><div class="card" style="text-align:center">${avh()}<b>${esc(u.name)}</b><div class="mu">นักศึกษา มศว · ${esc(u.email)}</div></div>
<div class="card stat"><div><b>${S.items.filter(i=>i.type==='lost').length}</b><span class="mu">ประกาศของหาย</span></div><div><b>${S.items.filter(i=>i.type==='found').length}</b><span class="mu">ของที่เก็บได้</span></div><div><b>${S.items.filter(i=>i.st==='done').length}</b><span class="mu">ได้คืนแล้ว</span></div></div>
<div class="card"><div class="mn" onclick="location.hash='hist'"><i>📄</i><span>ประวัติประกาศ</span>›</div><div class="mn" onclick="location.hash='saved'"><i>💙</i><span>รายการที่บันทึกไว้ (${S.saved.length})</span>›</div><div class="mn" onclick="location.hash='prefs'"><i>⚙️</i><span>ตั้งค่า</span>›</div><div class="mn" onclick="location.hash='verify'"><i>✅</i><span>ยืนยันตัวตน</span><span class="tag ${S.verified.id?'t-found':'t-done'}">${S.verified.id?'ยืนยันแล้ว':S.verified.status==='pending'?'รอตรวจสอบ':'ยังไม่ยืนยัน'}</span></div></div></main>`}
const hist=()=>bar('ประวัติประกาศ',1)+'<main>'+(S.items.filter(i=>i.owner===S.user.email).map(itemRow).join('')||'<p class="mu" style="text-align:center;padding:30px">ยังไม่มีประกาศของคุณ กดปุ่ม + เพื่อสร้างประกาศแรก</p>')+'</main>';
const saved=()=>bar('รายการที่บันทึกไว้',1)+'<main>'+(S.items.filter(i=>S.saved.includes(i.id)).map(itemRow).join('')||'<p class="mu" style="text-align:center;padding:30px">ยังไม่มีรายการที่บันทึก</p>')+'</main>';

/* 11 verify */
const FAC=['คณะมนุษยศาสตร์','คณะสังคมศาสตร์','คณะวิทยาศาสตร์','คณะศึกษาศาสตร์','คณะวิศวกรรมศาสตร์','คณะพยาบาลศาสตร์','คณะพลศึกษา','คณะศิลปกรรมศาสตร์','คณะอื่นๆ'],mk=s=>s?s.slice(0,2)+'•'.repeat(Math.max(0,s.length-4))+s.slice(-2):'-';
function verify(){const v=S.verified,u=S.user||{},hd=bar('ยืนยันตัวตน',1),ic=(e,t,p)=>`<div style="text-align:center;font-size:60px">${e}</div><h2 style="text-align:center;font-size:18px">${t}</h2><p class="mu" style="text-align:center;margin:6px 0 14px">${p}</p>`;
if(v.status==='ok'||v.id)return`${hd}<main>${ic('✅','ยืนยันตัวตนแล้ว','ป้ายยืนยันตัวตนจะแสดงในโปรไฟล์ของคุณ')}<div class="card"><div class="row"><b>ชื่อ</b>${esc(u.name)}</div><div class="row"><b>รหัสนิสิต</b>${mk(v.sid)}</div><div class="row"><b>คณะ</b>${esc(v.fac)}</div><div class="row"><b>อีเมล</b>${esc(v.mail)}</div></div><button class="btn o" onclick="vR()">ยื่นยืนยันตัวตนใหม่</button></main>`;
if(v.status==='pending')return`${hd}<main>${ic('⏳','รอเจ้าหน้าที่ตรวจสอบ','ส่งคำขอเมื่อ '+fd(v.sentAt)+' '+ft(v.sentAt)+' น. โดยปกติใช้เวลา 1–2 วันทำการ')}<div class="card"><div class="row"><b>✓ อีเมล</b>${esc(v.mail)}</div><div class="row"><b>✓ รูปบัตร</b>ส่งแล้ว</div><div class="row"><b>⏳ ตรวจสอบ</b>กำลังดำเนินการ</div></div><p class="mu" style="text-align:center">เวอร์ชันเดโมไม่มีเจ้าหน้าที่จริง กดปุ่มด้านล่างเพื่อจำลองผลอนุมัติ</p><button class="btn g" onclick="vA()">จำลองผลอนุมัติ (เดโม)</button><button class="btn o" onclick="vR()">ยกเลิกคำขอ</button></main>`;
const n=v.step||1,sp=[1,2,3].map(i=>`<span class="tag ${i<=n?'t-found':'t-done'}">${i}. ${['ข้อมูลนิสิต','บัตรนักศึกษา','อีเมล'][i-1]}</span>`).join(' ');
const b=n===1?`<label class="l" for="sid">รหัสนิสิต</label><input class="in" id="sid" inputmode="numeric" maxlength="11" value="${esc(v.sid)}" placeholder="ตัวเลข 10–11 หลัก"><label class="l" for="fac">คณะ</label><select id="fac"><option value="">เลือกคณะ</option>${FAC.map(f=>`<option ${v.fac===f?'selected':''}>${f}</option>`).join('')}</select><button class="btn" onclick="vNext(1)">ถัดไป</button>`
:n===2?`<p class="mu">ถ่ายรูปบัตรนักศึกษาด้านหน้าให้เห็นชื่อและรูปชัดเจน ปิดเลขบัตรประชาชน (ถ้ามี) ก่อนถ่าย</p><div class="up" style="margin-top:10px"><label><i>📷</i>ถ่ายรูปบัตร<input type="file" accept="image/*" capture="environment" hidden onchange="vPic(this)"></label><label><i>⬆️</i>อัปโหลด<input type="file" accept="image/*" hidden onchange="vPic(this)"></label></div>${v.img?`<img src="${v.img}" alt="รูปบัตรนักศึกษา" style="width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-top:10px">`:''}<div class="up"><button class="btn o" onclick="vBack()">ย้อนกลับ</button><button class="btn" onclick="vNext(2)">ถัดไป</button></div><p class="mu" style="margin-top:10px">เวอร์ชันเดโมเก็บรูปไว้ในเบราว์เซอร์ของคุณเท่านั้น</p>`
:`<label class="l" for="vm">อีเมลมหาวิทยาลัย</label><input class="in" id="vm" type="email" value="${esc(v.mail||'')}" placeholder="name@g.swu.ac.th"><button class="btn o" onclick="vSend()">${v.otp?'ส่งรหัสอีกครั้ง':'ส่งรหัสยืนยัน'}</button>${v.otp?`<div class="card" style="background:var(--bl);margin-top:12px"><b>รหัสทดลอง: ${v.otp}</b><div class="mu">เดโมไม่ส่งอีเมลจริง ระบบจริงจะส่งรหัส 6 หลักไปที่อีเมลนี้ (หมดอายุใน 5 นาที)</div></div><label class="l" for="vcode">กรอกรหัส 6 หลัก</label><input class="in" id="vcode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn" onclick="vOk()">ยืนยันและส่งคำขอ</button>`:''}<button class="btn o" onclick="vBack()">ย้อนกลับ</button>`;
return`${hd}<main>${ic('🛡️','ยืนยันตัวตนนิสิต','ช่วยให้ผู้อื่นมั่นใจเมื่อนัดรับของ ทำครบ 3 ขั้นตอน')}<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px">${sp}</div><div class="card">${b}</div></main>`}
function vNext(n){const v=S.verified;if(n===1){const s=$('#sid').value.trim(),f=$('#fac').value;if(!/^\d{10,11}$/.test(s))return toast('รหัสนิสิตต้องเป็นตัวเลข 10–11 หลัก');if(!f)return toast('เลือกคณะ');v.sid=s;v.fac=f;v.step=2}else{if(!v.img)return toast('แนบรูปบัตรนักศึกษาก่อน');v.step=3}save();render()}
const vBack=()=>{S.verified.step=(S.verified.step||1)-1;save();render()};
function vPic(i){const f=i.files[0];if(f&&/^image\//.test(f.type))readImg(f,d=>{S.verified.img=d;save();render()});else toast('เลือกไฟล์รูปภาพเท่านั้น')}
function vSend(){const m=$('#vm').value.trim().toLowerCase();if(!/^[^\s@]+@(g\.)?swu\.ac\.th$/.test(m))return toast('ใช้อีเมลมหาวิทยาลัย (@g.swu.ac.th)');const v=S.verified;v.mail=m;v.otp=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);v.otpT=Date.now()+3e5;v.tries=0;save();render()}
function vOk(){const v=S.verified,c=$('#vcode').value.trim();if(Date.now()>v.otpT)return toast('รหัสหมดอายุ กดส่งรหัสอีกครั้ง');if(c!==v.otp){if(++v.tries>=5){v.otp='';save();render();return toast('ผิดหลายครั้ง กรุณาขอรหัสใหม่')}save();return toast('รหัสไม่ถูกต้อง')}v.otp='';v.status='pending';v.sentAt=Date.now();save();render();toast('ส่งคำขอแล้ว')}
function vA(){const v=S.verified;v.status='ok';v.id=true;save();render();toast('ยืนยันตัวตนสำเร็จ ✓')}
function vR(){if(!confirm('เริ่มกรอกใหม่?'))return;S.verified={};save();render()}

/* 12 notifications */
const nlist=()=>{const me=S.user&&S.user.email,o=S.items.filter(i=>i.owner!==me&&i.st==='open').slice(0,3).map(i=>[i.type,i.type==='lost'?'🔍':'🔔','มีประกาศใหม่: '+i.title,i.place+' · '+fd(i.d)+' '+ft(i.d)+' น.','item-'+i.id,'i'+i.id]);return[...o,['sys','🗺️','ดูแผนที่ตำแหน่งที่พบของ','แตะเพื่อเปิดแผนที่มหาวิทยาลัย','map','s1'],['sys','ℹ️','ยินดีต้อนรับสู่ Smart Lost & Found','แตะเพื่อดูโปรไฟล์และตั้งค่า','prefs','s2']]};
const unread=()=>nlist().some(n=>!S.nr.includes(n[5]));
function rd(k,h){if(!S.nr.includes(k)){S.nr.push(k);save()}location.hash=h}
function notif(){const T=[['all','ทั้งหมด'],['lost','ของหาย'],['found','ของที่เก็บได้'],['sys','ระบบ']],L=nlist().filter(n=>nt==='all'||n[0]===nt);return`${bar('แจ้งเตือน',1,'<button class="ib" title="อ่านทั้งหมด" aria-label="อ่านทั้งหมด" onclick="S.nr=nlist().map(n=>n[5]);save();render()">✓</button>')}<main><div class="seg" style="overflow-x:auto">${T.map(([k,l])=>`<button class="${nt===k?'on':''}" style="white-space:nowrap" onclick="nt='${k}';render()">${l}</button>`).join('')}</div><div style="margin-top:12px">${L.map(n=>{const r=S.nr.includes(n[5]);return`<div class="card it" onclick="rd('${n[5]}','${n[4]}')" style="${r?'':'border-color:var(--b)'}"><div class="th" style="border-radius:50%">${n[1]}</div><div style="flex:1;min-width:0"><b style="font-weight:500">${esc(n[2])}</b><div class="mu">${esc(n[3])}</div></div>${r?'':'<span class="dot" style="position:static;flex:none"></span>'}</div>`}).join('')||'<p class="mu" style="text-align:center;padding:30px">ไม่มีแจ้งเตือน</p>'}</div></main>`}

/* 13 prefs */
function prefs(){const u=S.user||{name:'นักศึกษา ก.'};return`${bar('ตั้งค่าโปรไฟล์',1)}<main><div class="card" style="text-align:center">${avh()}<b>${esc(u.name)}</b><div class="mu">นักศึกษา มศว</div></div>
<div class="card"><label class="mn"><i>🖼️</i><span>เปลี่ยนรูปโปรไฟล์</span>›<input type="file" accept="image/*" hidden onchange="avP(this)"></label><div class="mn" onclick="ed()"><i>👤</i><span>ข้อมูลส่วนตัว</span>›</div><div class="mn" onclick="location.hash='verify'"><i>✅</i><span>การยืนยันตัวตน</span>›</div><div class="mn" onclick="cpw()"><i>🔒</i><span>เปลี่ยนรหัสผ่าน</span>›</div><div class="mn" onclick="location.hash='hist'"><i>📄</i><span>ประวัติประกาศ</span>›</div><div class="mn" onclick="location.hash='notif'"><i>🔔</i><span>การแจ้งเตือน</span>›</div><div class="mn" onclick="toast('ติดต่อ: lostfound@swu.ac.th (ตัวอย่าง)')"><i>🎧</i><span>ติดต่อผู้ดูแล / แจ้งปัญหา</span>›</div><div class="mn" onclick="if(confirm('ล้างข้อมูลตัวอย่างทั้งหมด?')){localStorage.removeItem('slf');S=seed();location.hash='login';render()}"><i>🗑️</i><span>รีเซ็ตข้อมูลเดโม</span>›</div><div class="mn" onclick="if(confirm('ออกจากระบบ?')){S.user=null;save();location.hash='login'}"><i>↩️</i><span>ออกจากระบบ</span>›</div></div></main>`}
function ed(){const n=prompt('ชื่อที่แสดง',(S.user&&S.user.name)||'');if(n&&n.trim()){S.user.name=n.trim();const u=U();if(u[S.user.email]){u[S.user.email].name=S.user.name;sU(u)}save();render();toast('บันทึกชื่อแล้ว ✓')}}

/* router */
const NAV=[['home','🏠','หน้าหลัก'],['map','📍','แผนที่'],['post','+',''],['cal','📅','ปฏิทิน'],['me','👤','โปรไฟล์']];
function render(){const h=location.hash.slice(1)||'login',[r,...rest]=h.split('-'),a=rest.join('-');
const P={login:()=>login(0),register:()=>login(1),home,post,map,cal,me,scan,verify,notif,prefs,hist,saved,item:()=>item(a),chat:()=>chat(a),event:()=>event(a)};
if(!S.user&&!['login','register'].includes(r)){location.hash='login';return}
if(S.user&&['login','register'].includes(r)){location.hash='home';return}
const y=window.scrollY;$('#v').innerHTML=(P[r]||home)();
const showNav=['home','post','map','cal','me'].includes(r);$('#nv').style.display=showNav?'flex':'none';$('#nv').innerHTML=NAV.map(([k,i,l])=>k==='post'?`<button class="fab" onclick="location.hash='post'">+</button>`:`<button class="${r===k?'on':''}" onclick="location.hash='${k}'"><i>${i}</i>${l}</button>`).join('');
const same=r==='chat'||r==='cal'||r==='map'||r==='home';if(same)window.scrollTo(0,y);else window.scrollTo(0,0);
if(r==='chat'){const m=$('#ms');if(m)window.scrollTo(0,document.body.scrollHeight)}}
const TT={login:'เข้าสู่ระบบ',register:'สมัครสมาชิก',home:'หน้าหลัก',post:'ประกาศ',map:'แผนที่',cal:'ปฏิทิน',me:'โปรไฟล์',scan:'สแกนรูป',verify:'ยืนยันตัวตน',notif:'แจ้งเตือน',prefs:'ตั้งค่า',hist:'ประวัติประกาศ',saved:'รายการที่บันทึก',item:'รายละเอียดประกาศ',chat:'แชท',event:'กิจกรรมรายวัน'};
const R0=render;render=function(){R0();document.querySelectorAll('#v [onclick]').forEach(e=>{if(!/^(BUTTON|A|INPUT|SELECT)$/.test(e.tagName)){e.setAttribute('role','button');e.tabIndex=0}});document.title=(TT[(location.hash.slice(1)||'login').split('-')[0]]||'')+' – Smart Lost & Found'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const s=document.querySelector('.sheet');if(s)s.remove()}if(e.key==='Enter'&&e.target.matches('.card .in')&&['login','register'].includes(location.hash.slice(1)||'login')){const b=document.querySelector('.card .btn');if(b)b.click()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
/* avatar */
const avh=()=>{const u=S.user||{};return`<label class="av" style="cursor:pointer;position:relative;${u.av?`background-image:url(${u.av})`:''}" aria-label="เปลี่ยนรูปโปรไฟล์">${u.av?'':'👩‍🎓'}<span style="position:absolute;right:-2px;bottom:-2px;background:var(--b);color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center">📷</span><input type="file" accept="image/*" hidden onchange="avP(this)"></label>`};
function avP(i){const f=i.files[0];if(f&&/^image\//.test(f.type))readImg(f,d=>{S.user.av=d;const u=U();if(u[S.user.email]){u[S.user.email].av=d;sU(u)}save();render();toast('เปลี่ยนรูปโปรไฟล์แล้ว ✓')},160);else toast('เลือกไฟล์รูปภาพเท่านั้น')}
/* shared database */
const newId=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const dbw=(id,f)=>{if(DB)try{f(DB.collection('items').doc(String(id))).catch(()=>toast('บันทึกลงฐานข้อมูลกลางไม่ได้ (ต้องมีสิทธิ์ผู้ร่วมแก้ไข)'))}catch(e){}};
const cl=d=>({id:+d.id,type:d.type==='found'?'found':'lost',cat:Math.min(7,Math.max(0,+d.cat||0)),title:String(d.title||'').slice(0,80),desc:String(d.desc||'').slice(0,500),place:PL[d.place]?d.place:'อื่นๆ',d:+d.d||0,contact:String(d.contact||'').slice(0,80),by:String(d.by||'').slice(0,60),st:d.st==='done'?'done':'open',img:/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(d.img||'')?d.img:'',owner:String(d.owner||'')});
(async()=>{try{if(!window.claude)return;const d=await claude.use('db');if(!d)return;DB=d;
DB.collection('items').onSnapshot(sn=>{dbOK=true;S.items=sn.docs.map(x=>cl(x.data())).filter(i=>i.id>0).sort((a,b)=>b.d-a.d);const r=(location.hash.slice(1)||'login').split('-')[0],t=(document.activeElement||{}).tagName;if(S.user&&['home','map','cal','event','item','hist','saved','notif'].includes(r)&&!/^(INPUT|TEXTAREA|SELECT)$/.test(t))render()},()=>toast('เชื่อมต่อฐานข้อมูลไม่ได้'))}catch(e){}})();
window.addEventListener('hashchange',render);render();
</script>


</body></html>
