<script src="https://cdn.jsdelivr.net/npm/lucide@0.400.0/dist/umd/lucide.min.js"></script>
<script>
/* lucide รุ่นนี้ส่งไอคอนเป็น ["svg", {attrs}, [children]] แต่โค้ดของแอปอ่านเป็นรายการ [tag, attrs] ล้วน ๆ
   แปลงให้ตรงกันก่อนแอปเริ่มทำงาน (ไม่กระทบถ้าไลบรารีส่งรูปแบบที่แอปอ่านได้อยู่แล้ว) */
(function(){
  try{
    var L=window.lucide;if(!L||!L.icons)return;
    var src=L.icons,out={};
    for(var k in src){
      var v=src[k];
      out[k]=(Array.isArray(v)&&v[0]==='svg'&&Array.isArray(v[2]))?v[2]:v;
    }
    try{L.icons=out;}catch(e){}
    if(L.icons!==out)Object.defineProperty(L,'icons',{value:out,configurable:true});
  }catch(e){console.warn('lucide icon fix failed',e);}
})();
</script>

<body class="bg-slate-100 text-slate-800 antialiased font-['Prompt','Plus_Jakarta_Sans',sans-serif]">
<div id="root"></div>
<!-- ============================================================
  บทบาทผู้ใช้ (ผู้ตามหา / ผู้พบ / แอดมิน) : ทำให้แชท ปุ่มคำตอบด่วน ปฏิทิน และป้ายสถานะ
  สอดคล้องกับว่าตอนนี้ผู้ใช้เป็นใครเมื่อเทียบกับประกาศนั้น
  - เจ้าของประกาศ "ของหาย" = ผู้ตามหา   - เจ้าของประกาศ "ของที่เก็บได้" = ผู้พบ
  - คนอื่นที่เปิดประกาศ "ของหาย" = ผู้พบ  - คนอื่นที่เปิดประกาศ "ของที่เก็บได้" = ผู้ตามหา
  - เจ้าหน้าที่ (แอดมิน) = ผู้ดูแลจุดรับฝาก
============================================================ -->
<script>
(()=>{
  const NAMES={'user-nattida':'นัทธิดา จ.','user-thanapat':'ธนภัทร พ.'};
  const tail=id=>id==='user-thanapat'?'ครับ':'ค่ะ';
  const svgAvatar=(name,bg)=>'data:image/svg+xml;utf8,'+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="${bg}"/><text x="32" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#fff">${name.trim().charAt(0)}</text></svg>`);

  /* บทบาทเมื่อเทียบกับประกาศ: 'seeker' | 'finder' | 'admin' */
  function roleOf(user,item){
    if(!user)return 'seeker';
    if(user.role==='admin')return 'admin';
    if(!item)return user.role==='finder'?'finder':'seeker';
    const mine=item.poster&&item.poster.id===user.id;
    return mine?(item.type==='lost'?'seeker':'finder'):(item.type==='lost'?'finder':'seeker');
  }
  const LABEL={seeker:'ผู้ตามหา',finder:'ผู้พบ',admin:'แอดมิน'};
  window.__swuRoleOf=roleOf;
  window.__swuRoleLabel=(user)=>user&&user.role==='admin'?'แอดมิน (เจ้าหน้าที่จุดรับฝาก)':user&&user.role==='finder'?'ผู้พบของ':'ผู้ตามหาของ';

  /* ผู้สนทนาอีกฝ่าย */
  function counterpart(item,user){
    const role=roleOf(user,item),mine=item.poster&&item.poster.id===user.id;
    if(!mine||role==='admin')return {id:item.poster.id,name:item.poster.name,avatar:item.poster.avatar,verified:!!item.poster.isVerified};
    const oid=user.id==='user-thanapat'?'user-nattida':(role==='seeker'?'user-thanapat':'user-nattida');
    const nm=NAMES[oid]||'ผู้ติดต่อ';
    return {id:oid,name:nm,avatar:svgAvatar(nm,role==='seeker'?'#0ea5e9':'#10b981'),verified:true};
  }
  window.__swuCP=counterpart;

  const HINT={'กระเป๋า':'ด้านในมีบัตรนักศึกษาและเงินสดบางส่วน','มือถือ':'หน้าจอล็อกเป็นรูปสัตว์เลี้ยง และเคสมีสติ๊กเกอร์','กุญแจ':'มีพวงกุญแจรูปตุ๊กตาห้อยอยู่','บัตรนักศึกษา':'ชื่อบนบัตรขึ้นต้นด้วยตัวอักษรตัวแรกของชื่อเรา','เอกสาร':'มีโน้ตลายมือเขียนไว้ที่หน้าแรก'};
  const hint=c=>HINT[c]||'มีรอยขีดข่วนเล็กน้อยที่มุมด้านหนึ่ง';

  /* บทสนทนาตัวอย่างตามบทบาท (ข้อความใหม่ที่ผู้ใช้พิมพ์จะต่อท้ายให้) */
  function script(item,user){
    const role=roleOf(user,item),cp=counterpart(item,user),me=tail(user.id),ot=tail(cp.id);
    const t=item.title,loc=item.location,bld=item.building||item.location;
    const M=(from,text,ts)=>({id:`demo-${from}-${ts}`,senderId:from==='me'?user.id:cp.id,senderName:from==='me'?user.name:cp.name,senderAvatar:from==='me'?user.avatar:cp.avatar,text,timestamp:ts});
    const desc=(item.description||'').slice(0,60);
    if(role==='admin')return [
      M('me',`เจ้าหน้าที่จุดรับฝาก ${bld} ${me} ได้รับ "${t}" ไว้ที่เคาน์เตอร์แล้ว${me}`,'09:05'),
      M('o',`ขอบคุณ${ot} ต้องเตรียมอะไรไปบ้าง${ot==='ครับ'?'ครับ':'คะ'}`,'09:07'),
      M('me',`กรุณานำบัตรนิสิตตัวจริงมาแสดง และแจ้งลักษณะเฉพาะที่ไม่ได้ลงในประกาศ${me} เปิดทำการ จ.–ศ. 08:30–16:30 น.`,'09:08'),
      M('o',`รับทราบ${ot} พรุ่งนี้ช่วงสายจะไปรับ${ot}`,'09:10'),
      M('me',`ยืนยันนัดรับพรุ่งนี้ 10:00 น. ที่จุดรับฝาก ${bld} ${me}`,'09:11')];
    if(role==='seeker'&&item.poster.id===user.id)return [   // เจ้าของของหาย คุยกับผู้พบ
      M('o',`สวัสดี${ot} เห็นประกาศตามหา "${t}" ผมน่าจะเจอที่ ${loc} ใช่ของคุณไหม${ot}`,'12:46'),
      M('me',`ใช่${me}! ขอบคุณมาก${me} ตอนนี้อยู่ที่ไหน${me==='ครับ'?'ครับ':'คะ'}`,'12:47'),
      M('o',`ฝากไว้ที่จุดรับฝาก ${bld} แล้ว${ot} ขอให้ช่วยยืนยันลักษณะก่อนรับนะ${ot}`,'12:48'),
      M('me',`มีลักษณะตามประกาศ${me}: ${desc}`,'12:50'),
      M('o',`ตรงกันเลย${ot} ไปรับที่เคาน์เตอร์ได้เลย อย่าลืมพกบัตรนิสิตตัวจริง${ot}`,'12:51')];
    if(role==='finder'&&item.poster.id===user.id)return [   // เจ้าของประกาศของที่เก็บได้ คุยกับผู้มาขอรับ
      M('o',`สวัสดี${ot} เห็นประกาศว่าพบ "${t}" ที่ ${loc} น่าจะเป็นของดิฉัน${ot}`,'12:46'),
      M('me',`สวัสดี${me} ช่วยบอกลักษณะเฉพาะที่ไม่ได้ลงในประกาศหน่อยได้ไหม${me}`,'12:47'),
      M('o',hint(item.category)+`${ot}`,'12:49'),
      M('me',`ตรงกับที่พบ${me} ผมฝากไว้ที่จุดรับฝาก ${bld} แล้ว ให้เจ้าหน้าที่ตรวจบัตรก่อนรับนะ${me}`,'12:50'),
      M('o',`ขอบคุณมาก${ot} จะไปรับพรุ่งนี้${ot}`,'12:52')];
    if(role==='seeker')return [   // ผู้ตามหา ติดต่อผู้พบของที่ประกาศไว้
      M('me',`สวัสดี${me} เห็นประกาศว่าพบ "${t}" น่าจะเป็นของ${user.id==='user-thanapat'?'ผม':'ดิฉัน'}${me}`,'12:46'),
      M('o',`สวัสดี${ot} ช่วยบอกลักษณะเฉพาะที่ไม่ได้ลงในประกาศหน่อย${ot}`,'12:47'),
      M('me',hint(item.category)+me,'12:49'),
      M('o',`ตรงกันเลย${ot} ฝากไว้ที่จุดรับฝาก ${bld} แล้ว พกบัตรนิสิตตัวจริงไปรับด้วยนะ${ot}`,'12:51'),
      M('me',`ขอบคุณมาก${me} จะไปรับพรุ่งนี้${me}`,'12:52')];
    return [   // ผู้พบ ติดต่อเจ้าของประกาศของหาย
      M('me',`สวัสดี${me} เห็นประกาศตามหา "${t}" ผมน่าจะเจอของที่ตรงกัน${me}`,'12:46'),
      M('o',`จริงหรือ${ot}! ขอบคุณมาก เจอที่ไหน${ot==='ครับ'?'ครับ':'คะ'}`,'12:47'),
      M('me',`เจอบริเวณ ${loc} ${me}`,'12:48'),
      M('o',`ใช่ที่นั่นเลย${ot} ช่วยฝากไว้ที่จุดรับฝากได้ไหม${ot==='ครับ'?'ครับ':'คะ'}`,'12:49'),
      M('me',`ได้${me} จะนำไปฝากที่จุดรับฝาก ${bld} วันนี้${me}`,'12:50')];
  }
  window.__swuChatView=(e,item,user)=>{
    const live=(e||[]).filter(m=>m.conversationId==='conv-'+item.id&&m.senderId===user.id&&/^msg-\d{13}/.test(m.id));
    return script(item,user).concat(live);
  };

  const CHIPS={
    seeker:(i,u)=>{const me=tail(u.id),b=i.building||'จุดรับฝาก';return i.poster.id===u.id
      ?[`ขอบคุณมาก ใช่ของ${u.id==='user-thanapat'?'ผม':'ดิฉัน'}เลย${me}`,`ฝากไว้ที่จุดรับฝาก ${b} ได้ไหม${me==='ครับ'?'ครับ':'คะ'}`,'ลักษณะเฉพาะคือ…','พรุ่งนี้จะไปรับตอนบ่าย'+me]
      :[`ของชิ้นนี้น่าจะเป็นของ${u.id==='user-thanapat'?'ผม':'ดิฉัน'}${me}`,'ลักษณะเฉพาะคือ…','ขอรับที่จุดรับฝาก '+b+' ได้ไหม','สะดวกรับวันไหน'+(me==='ครับ'?'ครับ':'คะ')+'?'];},
    finder:(i,u)=>{const me=tail(u.id),b=i.building||'จุดรับฝาก';return i.poster.id===u.id
      ?['ขอทราบลักษณะเฉพาะของสิ่งของหน่อย'+me,`ฝากไว้ที่จุดรับฝาก ${b} แล้ว${me}`,'กรุณาพกบัตรนิสิตตัวจริงไปยืนยัน','ตอนนี้ยังอยู่กับ'+(u.id==='user-thanapat'?'ผม':'ดิฉัน')+' ยังไม่ได้ส่งมอบ']
      :['ผมน่าจะเจอของที่ตรงกับประกาศ'+me,'เจอบริเวณ…','ส่งรูปให้ดูได้'+me,`จะนำไปฝากที่จุดรับฝาก ${b}`];},
    admin:(i)=>{const b=i.building||'จุดรับฝาก';return ['ยืนยันนัดรับที่จุดรับฝาก '+b,'กรุณานำบัตรนิสิตตัวจริงมาแสดง','เปิดทำการ จ.–ศ. 08:30–16:30 น.','ของยังอยู่ที่จุดรับฝากค่ะ']}
  };
  window.__swuChips=(item,user)=>CHIPS[roleOf(user,item)](item,user);
  window.__swuAiChips=(user)=>user&&user.role==='admin'
    ?['ขั้นตอนตรวจสอบก่อนส่งมอบของ','ของค้างครบ 30 วันทำอย่างไร','จะโอนของไปจุดอื่นได้อย่างไร']
    :user&&user.role==='finder'
    ?['เก็บของได้ ต้องนำไปฝากที่ไหน','ควรโพสต์รูปอะไรบ้าง','จะซ่อนเบอร์โทรอย่างไร']
    :['จุดรับของหายอยู่ที่ไหน','ต้องเตรียมอะไรไปรับของคืน','ของหายนานแล้วทำอย่างไร'];
  window.__swuChatSub=(item,user)=>{const r=roleOf(user,item);return 'คุณคือ'+LABEL[r]+' · คู่สนทนา: '+(r==='admin'?'ผู้ใช้งาน':r==='seeker'?'ผู้พบ':'ผู้ตามหา');};
  window.__swuCalText=(user)=>user&&user.role==='admin'
    ?{title:'ของที่ฝากเข้าจุดรับฝาก/ประกาศในวันนี้',empty:'ไม่มีของฝากเข้าจุดรับฝากในวันนี้ — ดูรายการทั้งหมดได้ที่เมนู "ของที่ถือ"'}
    :user&&user.role==='finder'
    ?{title:'ประกาศในวันนี้ (มุมมองผู้พบ)',empty:'วันนี้ยังไม่มีประกาศ — ถ้าคุณเก็บของได้ กดแท็บ "ประกาศ" เพื่อแจ้งผู้ตามหา'}
    :{title:'รายการตามหาในวันนี้ (มุมมองผู้ตามหา)',empty:'วันนี้ไม่มีรายการ — ลองเลือกวันที่มีจุดสี หรือกด "ดูทั้งหมด" เพื่อค้นหาของที่มีคนเก็บได้'};
})();
</script>
<script>
/* ตัวกันหน้าว่าง: ล้างข้อมูลผู้ใช้ที่ค้างในเบราว์เซอร์ถ้าเสียหาย และแสดงข้อความ error ถ้าแอปเปิดไม่ขึ้น */
(function(){
  try{
    var k='swu_lost_found_user',v=localStorage.getItem(k);
    if(v){var o=JSON.parse(v);if(!o||typeof o!=='object'||!Array.isArray(o.bookmarkedItemIds))localStorage.removeItem(k);}
  }catch(e){try{localStorage.removeItem('swu_lost_found_user');}catch(_){}}
  var last='';
  window.addEventListener('error',function(e){last=(e&&e.message)||last;});
  window.addEventListener('unhandledrejection',function(e){last=String((e&&e.reason&&e.reason.message)||e.reason||last);});
  window.addEventListener('load',function(){
    setTimeout(function(){
      var r=document.getElementById('root');
      if(r&&r.children.length===0){
        var d=document.createElement('div');
        d.style.cssText='margin:16px;padding:12px;background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;border-radius:8px;font:14px/1.5 sans-serif';
        d.textContent='แอปเปิดไม่ขึ้น'+(last?' — '+last:'')+' (ลองรีเฟรชด้วย Ctrl+Shift+R หรือส่งข้อความนี้ให้ผู้พัฒนา)';
        document.body.appendChild(d);
      }
    },2500);
  });

<!-- ============================================================
  Supabase connector (อ่านง่าย แก้ไขได้)
  ใส่ค่าสองตัวนี้แล้วประกาศจะถูกเก็บในฐานข้อมูลที่ทุกคนเห็นร่วมกัน
  เว้นว่างไว้ = โหมดเดโม่ (ข้อมูลอยู่ในหน้าเว็บของแต่ละคน)
============================================================ -->
<script>
const SB_URL='',SB_KEY='';

(()=>{
  if(!SB_URL||!SB_KEY){console.info('[Smart Lost & Found] โหมดเดโม่: ยังไม่ได้ตั้งค่า Supabase');return;}

  const base=SB_URL.replace(/\/+$/,'');
  const AUTH={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
  const BUCKET='item-images';
  const shadow=new Set();                    // id ใน mock ที่เป็นสำเนาของประกาศที่อยู่ใน Supabase แล้ว (ไม่แสดงซ้ำ)
  const prev=window.fetch.bind(window);      // mock API เดิมของแอป (แชต/แจ้งเตือน/AI ยังใช้ตัวนี้)
  const json=(d,s=200)=>new Response(JSON.stringify(d),{status:s,headers:{'Content-Type':'application/json'}});

  /* ย่อรูปเป็น JPEG ด้านยาวไม่เกิน 1024px ก่อนอัปโหลด */
  function shrink(dataUrl,max=1024,q=0.8){
    return new Promise(resolve=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*k));
        c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        c.toBlob(b=>resolve(b),'image/jpeg',q);
      };
      im.onerror=()=>resolve(null);
      im.src=dataUrl;
    });
  }

  async function uploadImage(dataUrl,path){
    const blob=await shrink(dataUrl);
    if(!blob)return null;
    const r=await prev(`${base}/storage/v1/object/${BUCKET}/${path}`,{
      method:'POST',
      headers:{...AUTH,'Content-Type':'image/jpeg','x-upsert':'false'},
      body:blob
    });
    return r.ok?`${base}/storage/v1/object/public/${BUCKET}/${path}`:null;
  }

  /* ---------- รายการประกาศ ---------- */
  let cache=null,cacheAt=0,inflight=null;
  const TTL=5000;   // แอปดึงข้อมูลทุก 4 วินาที: แคช 5 วินาทีเพื่อลดภาระฐานข้อมูล

  async function loadItems(){
    if(cache&&Date.now()-cacheAt<TTL)return cache;
    if(inflight)return inflight;
    inflight=(async()=>{
      try{
        const res=await prev(`${base}/rest/v1/items?select=id,status,data,created_at&order=created_at.desc&limit=200`,{headers:AUTH});
        if(!res.ok)throw new Error('HTTP '+res.status);
        const rows=await res.json();
        const dbItems=rows.map(r=>({...r.data,id:r.id,status:r.status,createdAt:r.created_at}));
        const mock=await (await prev('/api/items')).json();
        const local=(mock||[]).filter(i=>!shadow.has(i.id));   // รายการตัวอย่าง + รายการที่บันทึกในเครื่องเท่านั้น
        cache=[...dbItems,...local];
        cacheAt=Date.now();
        return cache;
      }finally{inflight=null;}
    })();
    return inflight;
  }
  const bust=()=>{cache=null;cacheAt=0;};

  async function createItem(body,url,opts){
    const id=`item-${Date.now()}-${Math.floor(Math.random()*1000)}`;
    const images=[];
    const list=Array.isArray(body.images)?body.images.slice(0,4):[];
    for(let i=0;i<list.length;i++){
      const src=list[i];
      if(typeof src==='string'&&src.startsWith('data:')){
        const pub=await uploadImage(src,`${id}-${i}.jpg`).catch(()=>null);
        if(pub)images.push(pub);
      }else if(typeof src==='string'){images.push(src);}
    }
    const item={...body,id,images,status:body.status||'open',createdAt:new Date().toISOString()};
    const res=await prev(`${base}/rest/v1/items`,{
      method:'POST',
      headers:{...AUTH,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify({id,type:item.type,status:item.status,data:item})
    });
    if(!res.ok)throw new Error('insert failed: '+res.status);
    bust();
    try{                                     // ให้ mock สร้างแจ้งเตือน "ประกาศใหม่" ในหน้าเว็บด้วย
      const mi=await (await prev(url,opts)).json();
      if(mi&&mi.id)shadow.add(mi.id);
    }catch{}
    return item;
  }

  async function setStatus(id,status){
    const res=await prev(`${base}/rest/v1/items?id=eq.${encodeURIComponent(id)}`,{
      method:'PATCH',
      headers:{...AUTH,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify({status})
    });
    if(!res.ok)throw new Error('update failed: '+res.status);
    bust();
  }

  /* ---------- ดักการเรียก /api/items ---------- */
  window.fetch=async(input,opts={})=>{
    const url=typeof input==='string'?input:input.url;
    const method=(opts.method||'GET').toUpperCase();
    try{
      if(url==='/api/items'&&method==='GET')return json(await loadItems());
      if(url==='/api/items'&&method==='POST'){
        const body=opts.body?JSON.parse(opts.body):{};
        return json(await createItem(body,url,opts),201);
      }
      const m=url.match(/^\/api\/items\/([^/]+)\/status$/);
      if(m&&method==='PATCH'){
        const {status}=JSON.parse(opts.body||'{}');
        await setStatus(decodeURIComponent(m[1]),status).catch(e=>console.warn('[Smart Lost & Found] อัปเดตสถานะใน Supabase ไม่สำเร็จ',e));
        // ต่อด้วย mock เพื่ออัปเดตรายการตัวอย่าง/รายการในเครื่องด้วย
      }
    }catch(err){
      console.warn('[Smart Lost & Found] Supabase ใช้ไม่ได้ ใช้โหมดเดโม่ชั่วคราว:',err);
    }
    return prev(input,opts);
  };
  console.info('[Smart Lost & Found] เชื่อมต่อ Supabase แล้ว');
})();
</script>

  function itemRows() {

      field('adm-where', 'สถานที่พบ', 'เช่น โรงอาหาร ชั้น 1') + field('adm-finder', 'ผู้พบ/ผู้ส่งมอบ', 'ไม่ระบุก็ได้') +
      field('adm-secret', '🔒 ลักษณะเฉพาะ (ใช้ยืนยันเจ้าของ ไม่แสดงสาธารณะ)', 'เช่น ตำหนิ สิ่งที่อยู่ข้างใน เลขซีเรียล', true) + errBox() +
      btn('add-save', 'บันทึกรับเข้า', 'primary'));
  }
  function sheetPoint() {
    return sheet('เลือกจุดรับฝาก (เดโม่)',
      '<p class="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">ในระบบจริง เจ้าหน้าที่แต่ละคนถูกกำหนดจุดตายตัวและมองไม่เห็นจุดอื่น ตรงนี้ให้สลับเพื่อทดสอบสิทธิ์ของแต่ละจุดเท่านั้น</p>' +
      POINTS.map(function (p) {
        var on = p.id === S.point, n = S.items.filter(function (x) { return x.point === p.id && x.status === 'held'; }).length;
        return '<button data-a="point-set" data-id="' + p.id + '" class="w-full text-left rounded-2xl border p-3 ' + (on ? 'border-indigo-500 bg-indigo-50' : 'border-slate-200 bg-white') + '">' +
          '<div class="flex items-center justify-between"><p class="text-xs font-bold text-slate-900">' + esc(p.name) + '</p>' + (on ? pill('กำลังใช้งาน', 'indigo') : '') + '</div>' +
          '<p class="text-[11px] text-slate-500">' + esc(p.bld) + ' · ' + esc(p.role) + ': ' + esc(p.staff) + '</p><p class="text-[11px] text-slate-400">ของที่ถืออยู่ ' + n + ' ชิ้น</p></button>';
      }).join('') +
      '<div class="pt-2 border-t border-slate-100">' + btn('reset-open', 'รีเซ็ตข้อมูลเดโม่เป็นค่าเริ่มต้น', 'ghost') + '</div>');
  }
  function sheetTransfer(x) {
    return sheet('โอนย้ายไปจุดรับฝากอื่น',
      '<p class="text-[11px] text-slate-600 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">"' + esc(x.title) + '" อยู่ที่ ' + esc(pt().name) + ' ตอนนี้ · เมื่อโอนแล้ว คำขอรับคืนของชิ้นนี้จะย้ายไปจุดปลายทางด้วย และคุณจะไม่เห็นรายการนี้อีก</p>' +
      POINTS.filter(function (p) { return p.id !== S.point; }).map(function (p) {
        return '<button data-a="transfer-do" data-id="' + x.id + '" data-to="' + p.id + '" class="w-full text-left rounded-2xl border border-slate-200 bg-white p-3 hover:border-indigo-400">' +
          '<p class="text-xs font-bold text-slate-900">' + esc(p.name) + ' · ' + esc(p.bld) + '</p><p class="text-[11px] text-slate-500">' + esc(p.desk) + ' · ' + esc(p.hours) + '</p></button>';
      }).join(''), true);
  }
  function sheetReset() {
    return sheet('รีเซ็ตข้อมูลเดโม่', '<p class="text-xs text-slate-600">ข้อมูลตัวอย่างทั้งหมด (รวมที่คุณเพิ่ม/แก้ไข) จะกลับเป็นค่าเริ่มต้น ไม่กระทบข้อมูลจริงของแอป</p>' + btn('reset-do', 'ยืนยันรีเซ็ต', 'danger'), true);
  }

  function renderSheet() {
    var sh = ui.sheet;
    if (!sh) return '';
    var c = sh.id && claim(sh.id), x = sh.id && item(sh.id);
    switch (sh.t) {
      case 'claim': return c ? sheetClaim(c) : '';
      case 'item': return x ? sheetItem(x) : '';
      case 'approve': return c ? sheetApprove(c) : '';
      case 'reject': return c ? sheetReject(c) : '';
      case 'info': return c ? sheetInfo(c) : '';
      case 'handover': return x ? sheetHandover(x) : '';
      case 'dispose': return x ? sheetDispose(x) : '';
      case 'add': return sheetAdd();
      case 'point': return sheetPoint();
      case 'transfer': return x ? sheetTransfer(x) : '';
      case 'reset': return sheetReset();
    }
    return '';
  }

  /* ---------- วาดหน้าจอทั้งหมด ---------- */
  var host = null, lastKey = '';
  /* เก็บ/คืนค่าที่พิมพ์ในฟอร์มของแผ่นล่าง เมื่อวาดหน้าใหม่ (เช่น ขึ้นข้อความเตือน) ค่าจะไม่หาย */
  function snapForm() {
    var f = {};
    host.querySelectorAll('input[id^="adm-"], textarea[id^="adm-"], select[id^="adm-"]').forEach(function (e) {
      if (e.id === 'adm-q') return;
      f[e.id] = e.type === 'checkbox' ? e.checked : e.value;
    });
    host.querySelectorAll('input[type="radio"]:checked').forEach(function (e) { if (/^adm-/.test(e.name)) f['r:' + e.name] = e.value; });
    return f;
  }
  function restoreForm(f) {
    Object.keys(f).forEach(function (k) {
      if (k.indexOf('r:') === 0) {
        host.querySelectorAll('input[type="radio"][name="' + k.slice(2) + '"]').forEach(function (e) { e.checked = e.value === f[k]; });
      } else {
        var e = host.querySelector('#' + k);
        if (!e) return;
        if (e.type === 'checkbox') e.checked = !!f[k]; else e.value = f[k];
      }
    });
  }
  function render() {
    if (!host || !document.body.contains(host)) return;
    var keep = host.querySelector('#adm-scroll');
    var top = keep ? keep.scrollTop : 0;
    var key = ui.sheet ? ui.sheet.t + ':' + (ui.sheet.id || '') : '';
    var snap = key && key === lastKey ? snapForm() : null;
    var p = pt(), s = stats();
    var pendingN = s.pend.length + s.need.length;
    var tabs = [['home', 'ภาพรวม', 'home'], ['claims', 'คำขอรับคืน', 'inbox'], ['items', 'ของที่ถือ', 'box'], ['log', 'บันทึก', 'log']];
    var content = ui.tab === 'home' ? viewHome() : ui.tab === 'claims' ? viewClaims() : ui.tab === 'items' ? viewItems() : viewLog();
    var title = { home: 'ภาพรวมจุดรับฝาก', claims: 'คำขอรับคืน', items: 'ของที่ถืออยู่ในจุดนี้', log: 'บันทึกการดำเนินงาน' }[ui.tab];
    host.innerHTML =
      '<div class="flex-1 flex flex-col min-h-0 relative bg-slate-50 text-slate-800" style="font-family:inherit">' +
      '<div class="bg-slate-900 text-white px-4 pt-4 pb-3 shrink-0">' +
      '<div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="text-indigo-300">' + ico('shield', 'w-5 h-5') + '</span><div><p class="text-sm font-bold leading-tight">ศูนย์จัดการของหาย</p><p class="text-[10px] text-slate-400 leading-tight">สำหรับเจ้าหน้าที่ มศว</p></div>' +
      '<span class="ml-1 text-[9px] font-extrabold tracking-wider bg-amber-400 text-amber-950 px-1.5 py-0.5 rounded">DEMO</span></div>' +
      '<button data-a="exit" class="flex items-center gap-1 text-[11px] text-slate-300 hover:text-white bg-white/10 rounded-lg px-2.5 py-1.5">' + ico('out', 'w-3.5 h-3.5') + 'ออก</button></div>' +
      '<button data-a="point-open" class="mt-3 w-full flex items-center justify-between bg-white/10 hover:bg-white/15 rounded-xl px-3 py-2 text-left"><span class="min-w-0"><span class="block text-[10px] text-slate-400">จุดรับฝากของคุณ</span><span class="block text-xs font-bold truncate">' + esc(p.name) + ' · ' + esc(p.bld) + '</span></span>' + '<span class="text-[10px] font-bold text-indigo-300 shrink-0 flex items-center gap-0.5">เปลี่ยนจุด' + ico('chev', 'w-3.5 h-3.5') + '</span></button></div>' +
      '<div class="bg-amber-50 text-amber-900 text-[10px] leading-snug px-4 py-1.5 border-b border-amber-200 shrink-0">โหมดเดโม่: ข้อมูลตัวอย่างเก็บในเครื่องนี้ ไม่มีผลกับข้อมูลจริง · คุณเห็นเฉพาะของที่ฝากไว้ที่ ' + esc(p.name) + '</div>' +
      '<div id="adm-scroll" class="flex-1 overflow-y-auto no-scrollbar px-4 py-3 space-y-3 min-h-0">' +
      '<div class="flex items-center justify-between"><h2 class="text-sm font-extrabold text-slate-900">' + title + '</h2>' + (ui.tab === 'items' ? '<button data-a="add-open" class="flex items-center gap-1 text-[11px] font-bold bg-indigo-600 text-white rounded-lg px-2.5 py-1.5">' + ico('plus', 'w-3.5 h-3.5') + 'รับของเข้า</button>' : '') + '</div>' +
      content + '<div class="h-2"></div></div>' +
      '<div class="grid grid-cols-4 bg-white border-t border-slate-200 shrink-0">' +
      tabs.map(function (t) {
        var on = ui.tab === t[0];
        return '<button data-a="goto" data-tab="' + t[0] + '" class="relative flex flex-col items-center gap-0.5 py-2.5 ' + (on ? 'text-indigo-600' : 'text-slate-400') + '">' + ico(t[2], 'w-5 h-5') + '<span class="text-[10px] font-bold">' + t[1] + '</span>' +
          (t[0] === 'claims' && pendingN ? '<span class="absolute top-1.5 left-1/2 ml-2 min-w-[16px] h-4 px-1 rounded-full bg-rose-500 text-white text-[9px] font-bold flex items-center justify-center">' + pendingN + '</span>' : '') + '</button>';
      }).join('') + '</div>' +
      renderSheet() +
      (ui.toast ? '<div class="absolute top-3 left-4 right-4 z-40 bg-slate-900 text-white text-xs font-medium rounded-xl px-4 py-2.5 shadow-xl text-center">' + esc(ui.toast) + '</div>' : '') +
      '</div>';
    var sc = host.querySelector('#adm-scroll');
    if (sc) sc.scrollTop = top;
    if (snap) restoreForm(snap);
    lastKey = key;
    markSidebar();
  }

  /* ไฮไลต์เมนูด้านขวา (แผงจำลอง) ให้ตรงกับหน้าแอดมินที่เปิดอยู่ */
  function markSidebar() {
    var cur = ui.sheet && { point: 1, reset: 1, add: 1 }[ui.sheet.t] ? ui.sheet.t : ui.tab;
    document.querySelectorAll('button[data-admin-tab]').forEach(function (b) {
      var on = b.getAttribute('data-admin-tab') === cur;
      ['bg-sky-500', 'text-white', 'font-bold', 'shadow-md'].forEach(function (c) { b.classList.toggle(c, on); });
      b.classList.toggle('text-slate-300', !on);
    });
  }
  function nav(k) {
    if (!host) return;
    if (k === 'home' || k === 'claims' || k === 'items' || k === 'log') { ui.tab = k; ui.sheet = null; ui.prev = null; render(); }
    else if (k === 'add') { ui.tab = 'items'; ui.itemFilter = 'held'; openSheet('add'); }
    else if (k === 'point') openSheet('point');
    else if (k === 'reset') openSheet('reset');
    else if (k === 'exit') act('exit', {});
  }

  /* ---------- การทำงาน ---------- */
  function openSheet(t, id) { ui.prev = ui.sheet; ui.sheet = { t: t, id: id }; ui.err = ''; render(); }
  function closeSheet() { ui.sheet = null; ui.prev = null; ui.err = ''; render(); }
  function val(id) { var e = host.querySelector('#' + id); return e ? e.value.trim() : ''; }
  function chk(id) { var e = host.querySelector('#' + id); return !!(e && e.checked); }
  function fail(m) { ui.err = m; render(); }
  function mine(it) { return it && it.point === S.point; }   // สิทธิ์: จัดการได้เฉพาะของในจุดตัวเอง

  function act(a, d) {
    var c, x;
    switch (a) {
      case 'goto': ui.tab = d.tab; if (d.f) ui.itemFilter = d.f; ui.sheet = null; render(); break;
      case 'claim-filter': ui.claimFilter = d.f; render(); break;
      case 'item-filter': ui.itemFilter = d.f; render(); break;
      case 'claim-open': c = claim(d.id); if (!c || !mine(item(c.itemId))) return say('ไม่มีสิทธิ์ดูรายการของจุดอื่น'); openSheet('claim', d.id); break;
      case 'item-open': x = item(d.id); if (!mine(x)) return say('ไม่มีสิทธิ์ดูรายการของจุดอื่น'); openSheet('item', d.id); break;
      case 'approve-open': openSheet('approve', d.id); break;
      case 'reject-open': openSheet('reject', d.id); break;
      case 'info-open': openSheet('info', d.id); break;
      case 'handover-open': openSheet('handover', d.id); break;
      case 'dispose-open': openSheet('dispose', d.id); break;
      case 'add-open': openSheet('add'); break;
      case 'point-open': openSheet('point'); break;
      case 'transfer-open': x = item(d.id); if (!mine(x)) return say('ไม่มีสิทธิ์'); openSheet('transfer', d.id); break;
      case 'transfer-do':
        x = item(d.id); if (!mine(x) || x.status !== 'held' || !pt(d.to) || d.to === S.point) return say('โอนย้ายไม่ได้');
        var from = pt(), dest = pt(d.to);
        addLog(x.id, 'โอนย้ายไปจุด ' + dest.name + ' (' + dest.bld + ')');
        x.point = d.to;
        S.log.push({ t: Date.now(), point: d.to, itemId: x.id, text: 'รับโอนจากจุด ' + from.name + ' (' + from.bld + ')' });
        save(); ui.sheet = null; ui.prev = null; render(); say('โอนไปจุด ' + dest.name + ' แล้ว ของชิ้นนี้จะไม่แสดงในจุดนี้อีก'); break;
      case 'reset-open': openSheet('reset'); break;
      case 'close': closeSheet(); break;
      case 'back': ui.sheet = ui.prev; ui.prev = null; ui.err = ''; render(); break;
      case 'exit': if (window.__swuSwitchRole) window.__swuSwitchRole('student'); break;
      case 'point-set': S.point = d.id; save(); ui.sheet = null; ui.tab = 'home'; render(); say('สลับเป็นจุด ' + pt().name); break;
      case 'reset-do': S = seed(); save(); ui = { tab: 'home', claimFilter: 'pending', itemFilter: 'held', q: '', sheet: null, prev: null, toast: '', err: '' }; render(); say('รีเซ็ตข้อมูลเดโม่แล้ว'); break;

      case 'approve-do':
        c = claim(d.id); x = c && item(c.itemId); if (!mine(x)) return say('ไม่มีสิทธิ์');
        if (!chk('adm-chk1') || !chk('adm-chk2')) return fail('ต้องติ๊กยืนยันทั้งสองข้อก่อนส่งมอบ');
        var note = val('adm-note');
        c.status = 'approved'; x.status = 'returned'; x.returnedAt = Date.now(); x.returnedTo = c.name + ' (' + c.sid + ')';
        S.claims.forEach(function (o) { if (o.itemId === x.id && o.id !== c.id && (o.status === 'pending' || o.status === 'need_info')) { o.status = 'rejected'; o.reason = 'มีผู้รับของไปแล้ว'; } });
        addLog(x.id, 'อนุมัติและส่งมอบคืนให้ ' + c.name + ' (ตรวจบัตรตัวจริงแล้ว)' + (note ? ' · ' + note : ''));
        save(); ui.sheet = null; ui.prev = null; ui.err = ''; render(); say('ส่งมอบคืนเรียบร้อย: ' + x.title); break;
      case 'reject-do':
        c = claim(d.id); x = c && item(c.itemId); if (!mine(x)) return say('ไม่มีสิทธิ์');
        var rs = host.querySelector('input[name="adm-reason"]:checked'), reason = rs ? rs.value : '';
        if (/^อื่น ๆ/.test(reason) && !val('adm-note')) return fail('กรุณาระบุเหตุผลในหมายเหตุ');
        c.status = 'rejected'; c.reason = reason + (val('adm-note') ? ' (' + val('adm-note') + ')' : '');
        addLog(x.id, 'ปฏิเสธคำขอของ ' + c.name + ' · ' + c.reason);
        save(); ui.sheet = null; ui.prev = null; ui.err = ''; render(); say('ปฏิเสธคำขอแล้ว'); break;
      case 'info-do':
        c = claim(d.id); x = c && item(c.itemId); if (!mine(x)) return say('ไม่มีสิทธิ์');
        if (!val('adm-note')) return fail('กรุณาพิมพ์ข้อมูลที่ต้องการให้ผู้ขอเพิ่ม');
        c.status = 'need_info'; c.reason = val('adm-note');
        addLog(x.id, 'ขอข้อมูลเพิ่มจาก ' + c.name + ' · ' + c.reason);
        save(); ui.sheet = null; ui.prev = null; ui.err = ''; render(); say('ส่งคำขอข้อมูลเพิ่มแล้ว (เดโม่)'); break;
      case 'handover-do':
        x = item(d.id); if (!mine(x)) return say('ไม่มีสิทธิ์');
        if (!val('adm-name') || !val('adm-sid')) return fail('กรุณากรอกชื่อและรหัสผู้รับ');
        if (!chk('adm-chk1')) return fail('ต้องตรวจบัตรตัวจริงของผู้รับก่อนส่งมอบ');
        x.status = 'returned'; x.returnedAt = Date.now(); x.returnedTo = val('adm-name') + ' (' + val('adm-sid') + ')';
        S.claims.forEach(function (o) { if (o.itemId === x.id && (o.status === 'pending' || o.status === 'need_info')) { o.status = 'rejected'; o.reason = 'ส่งมอบให้เจ้าของที่จุดรับฝากแล้ว'; } });
        addLog(x.id, 'ส่งมอบคืนให้ ' + x.returnedTo + ' ที่จุดรับฝาก (ตรวจบัตรตัวจริงแล้ว)');
        save(); ui.sheet = null; ui.prev = null; ui.err = ''; render(); say('บันทึกการส่งมอบแล้ว'); break;
      case 'dispose-do':
        x = item(d.id); if (!mine(x)) return say('ไม่มีสิทธิ์');
        var dp = host.querySelector('input[name="adm-dispose"]:checked');
        x.status = 'disposed'; x.note = dp ? dp.value : '';
        addLog(x.id, 'ย้ายเป็นของค้าง · ' + x.note);
        save(); ui.sheet = null; ui.prev = null; render(); say('ย้ายเป็นของค้างแล้ว'); break;
      case 'add-save':
        if (!val('adm-title') || !val('adm-where')) return fail('กรุณากรอกชื่อของและสถานที่พบ');
        S.seq += 1;
        x = { id: 'n' + S.seq, point: S.point, title: val('adm-title'), cat: val('adm-cat') || 'อื่น ๆ', where: val('adm-where'), receivedAt: Date.now(), status: 'held', finder: val('adm-finder'), secrets: val('adm-secret') ? [['ลักษณะเฉพาะ', val('adm-secret')]] : [], returnedAt: null, returnedTo: null, note: '' };
        S.items.push(x); addLog(x.id, 'รับของเข้าจุดรับฝาก' + (x.finder ? ' (ผู้พบ: ' + x.finder + ')' : ''));
        save(); ui.sheet = null; ui.tab = 'items'; ui.itemFilter = 'held'; ui.q = ''; ui.err = ''; render(); say('รับของเข้าเรียบร้อย'); break;
    }
  }

  /* ---------- เชื่อมกับหน้าเว็บ ---------- */
  function mount(el) {
    host = el;
    el.setAttribute('data-mounted', '1');
    el.addEventListener('click', function (e) {
      var t = e.target.closest('[data-a]');
      if (!t || !el.contains(t)) return;
      if (t.dataset.a === 'close-bd' && e.target !== t) return;
      act(t.dataset.a === 'close-bd' ? 'close' : t.dataset.a, t.dataset);
    });
    el.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'adm-q') {
        ui.q = e.target.value;
        var l = el.querySelector('#adm-list'); if (l) l.innerHTML = itemRows();
      }
    });
    render();
  }
  function check() {
    var el = document.getElementById('admin-host');
    if (el && !el.getAttribute('data-mounted')) mount(el);
    else if (el && el.getAttribute('data-mounted') && !el.firstChild) { host = el; render(); }
  }
  new MutationObserver(check).observe(document.documentElement, { childList: true, subtree: true });
  check();
  window.__swuAdminDemo = { nav: nav, state: function () { return S; }, reset: function () { S = seed(); save(); render(); } };
})();

</script>

<!-- /* ============================================================
  สแกนสิ่งของจริง (วิเคราะห์ในเครื่อง ไม่ส่งรูปออกไปไหน)
  - กล้อง: getUserMedia (ถ้าไม่ได้ จะใช้แกลเลอรี่แทน)
  - ชนิดสิ่งของ: TensorFlow.js + MobileNet (โหลดจาก jsdelivr ครั้งแรกประมาณ 15 MB)
  - สี: หาสีเด่นจากกลางภาพ
  ข้อจำกัด: MobileNet รู้จักสิ่งของทั่วไป 1,000 ชนิด เช่น กระเป๋า มือถือ แว่น รองเท้า
  แต่ไม่รู้จัก "บัตร" หรือ "กุญแจ" โดยตรง ผลจึงเป็นตัวช่วยเติมฟอร์ม ผู้ใช้ต้องตรวจแก้เอง
============================================================ -->
<script>
(()=>{
  const TF='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
  const MN='https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js';

  /* คำค้นจากชื่อคลาส ImageNet -> [หมวดของแอป, ชื่อไทย] (ตัวที่เจอก่อนในรายการชนะ) */
  const MAP=[
    ['wallet',['กระเป๋า','กระเป๋าสตางค์']],['billfold',['กระเป๋า','กระเป๋าสตางค์']],
    ['purse',['กระเป๋า','กระเป๋าถือ']],['backpack',['กระเป๋า','กระเป๋าเป้']],['pouch',['กระเป๋า','กระเป๋าใบเล็ก']],['mailbag',['กระเป๋า','กระเป๋าสะพาย']],
    ['pencil box',['อุปกรณ์การเรียน','กล่องดินสอ']],
    ['cellular telephone',['มือถือ','โทรศัพท์มือถือ']],['mobile phone',['มือถือ','โทรศัพท์มือถือ']],['ipod',['มือถือ','โทรศัพท์มือถือ / เครื่องเล่นเพลง']],['hand-held computer',['มือถือ','โทรศัพท์มือถือ / แท็บเล็ต']],['dial telephone',['มือถือ','โทรศัพท์']],
    ['remote control',['กุญแจ','รีโมต / กุญแจรถ']],['padlock',['กุญแจ','แม่กุญแจ']],['combination lock',['กุญแจ','แม่กุญแจ']],['chain',['กุญแจ','พวงกุญแจ / โซ่']],
    ['envelope',['เอกสาร','ซองเอกสาร']],['book jacket',['เอกสาร','หนังสือ']],['comic book',['เอกสาร','หนังสือ']],['menu',['เอกสาร','เอกสาร']],['packet',['เอกสาร','ซอง / แพ็ก']],['binder',['เอกสาร','แฟ้มเอกสาร']],['notebook',['อุปกรณ์การเรียน','สมุด / โน้ตบุ๊ก']],
    ['laptop',['อุปกรณ์การเรียน','โน้ตบุ๊ก']],['mouse',['อุปกรณ์การเรียน','เมาส์']],['keyboard',['อุปกรณ์การเรียน','คีย์บอร์ด']],['calculator',['อุปกรณ์การเรียน','เครื่องคิดเลข']],
    ['ballpoint',['อุปกรณ์การเรียน','ปากกา']],['fountain pen',['อุปกรณ์การเรียน','ปากกา']],['pencil',['อุปกรณ์การเรียน','ดินสอ']],['rubber eraser',['อุปกรณ์การเรียน','ยางลบ']],['ruler',['อุปกรณ์การเรียน','ไม้บรรทัด']],['slide rule',['อุปกรณ์การเรียน','ไม้บรรทัด']],
    ['headphone',['อุปกรณ์การเรียน','หูฟัง']],['headset',['อุปกรณ์การเรียน','หูฟัง']],['hearing aid',['อุปกรณ์การเรียน','หูฟัง / อุปกรณ์เสียง']],['loudspeaker',['อุปกรณ์การเรียน','ลำโพง']],
    ['watch',['เครื่องแต่งกาย','นาฬิกาข้อมือ']],['sunglass',['เครื่องแต่งกาย','แว่นกันแดด']],['jersey',['เครื่องแต่งกาย','เสื้อ']],['sweatshirt',['เครื่องแต่งกาย','เสื้อ']],['cardigan',['เครื่องแต่งกาย','เสื้อคลุม']],['jean',['เครื่องแต่งกาย','กางเกงยีนส์']],
    ['coat',['เครื่องแต่งกาย','เสื้อคลุม']],['suit',['เครื่องแต่งกาย','เสื้อสูท']],['cap',['เครื่องแต่งกาย','หมวก']],['hat',['เครื่องแต่งกาย','หมวก']],['shoe',['เครื่องแต่งกาย','รองเท้า']],['sandal',['เครื่องแต่งกาย','รองเท้าแตะ']],['loafer',['เครื่องแต่งกาย','รองเท้า']],['sock',['เครื่องแต่งกาย','ถุงเท้า']],['scarf',['เครื่องแต่งกาย','ผ้าพันคอ']],['stole',['เครื่องแต่งกาย','ผ้าพันคอ']],['tie',['เครื่องแต่งกาย','เนคไท']],
    ['water bottle',['อื่น ๆ','ขวดน้ำ']],['thermos',['อื่น ๆ','กระติกน้ำ']],['water jug',['อื่น ๆ','กระบอกน้ำ']],['pill bottle',['อื่น ๆ','ขวด']],['umbrella',['อื่น ๆ','ร่ม']],['bottle',['อื่น ๆ','ขวด']],['cup',['อื่น ๆ','แก้วน้ำ']]
  ];

  /* ---------- สีเด่น ---------- */
  function colorName(r,g,b){
    r/=255;g/=255;b/=255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
    let h=0,sat=0;
    if(d>0){
      sat=d/(1-Math.abs(2*l-1));
      h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; if(h<0)h+=360;
    }
    if(l<0.17)return 'สีดำ';
    if(l>0.86&&sat<0.35)return 'สีขาว';
    if(sat<0.14)return l>0.6?'สีเทาอ่อน':'สีเทา';
    if(h<15||h>=345)return l<0.32?'สีแดงเข้ม':'สีแดง';
    if(h<45)return l<0.42?'สีน้ำตาล':'สีส้ม';
    if(h<68)return l<0.42?'สีน้ำตาล':'สีเหลือง';
    if(h<165)return 'สีเขียว';
    if(h<200)return 'สีฟ้าอมเขียว';
    if(h<255)return l>0.62?'สีฟ้า':'สีน้ำเงิน';
    if(h<290)return 'สีม่วง';
    return 'สีชมพู';
  }
  function dominantColor(ctx,w,h){
    const x0=Math.floor(w*0.2),y0=Math.floor(h*0.2),ww=Math.floor(w*0.6),hh=Math.floor(h*0.6);
    const px=ctx.getImageData(x0,y0,ww,hh).data,tally={};
    for(let i=0;i<px.length;i+=4*3){
      if(px[i+3]<200)continue;
      const n=colorName(px[i],px[i+1],px[i+2]);tally[n]=(tally[n]||0)+1;
    }
    const top=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
    return top?top[0]:'ไม่ระบุ';
  }

  /* ---------- โหลดโมเดลครั้งเดียว ---------- */
  const loadScript=src=>new Promise((ok,no)=>{
    const el=document.createElement('script');el.src=src;el.crossOrigin='anonymous';
    el.onload=ok;el.onerror=()=>no(new Error('โหลดไม่ได้: '+src));document.head.appendChild(el);
  });
  let modelP=null;
  function model(){
    if(!modelP)modelP=(async()=>{
      if(!window.tf)await loadScript(TF);
      if(!window.mobilenet)await loadScript(MN);
      return window.mobilenet.load({version:2,alpha:1.0});
    })().catch(e=>{modelP=null;throw e;});
    return modelP;
  }

  function loadImage(src){
    return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('อ่านรูปไม่ได้'));im.src=src;});
  }

  async function analyze(dataUrl){
    const im=await loadImage(dataUrl);
    const c=document.createElement('canvas');c.width=224;c.height=224;
    const ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(im,0,0,224,224);
    const color=dominantColor(ctx,224,224);

    let preds=null,modelOk=true;
    try{ preds=await (await model()).classify(c,5); }
    catch(e){ modelOk=false; console.warn('[สแกน] โหลดโมเดลไม่ได้ วิเคราะห์ได้เฉพาะสี',e); }

    let hit=null;
    if(preds){
      for(const p of preds){
        const name=String(p.className).toLowerCase();
        const m=MAP.find(([k])=>name.includes(k));
        if(m){hit={cat:m[1][0],th:m[1][1],prob:p.probability,raw:p.className};break;}
      }
    }
    const top=preds&&preds[0];
    let res;
    if(hit){
      res={itemName:`${hit.th} ${color}`,category:hit.cat,color,brand:'ไม่ระบุ',
        distinctiveFeatures:`ตรวจพบเป็น "${hit.th}" (โมเดลเห็นว่าคล้าย: ${hit.raw}) สีเด่นคือ${color.replace('สี','')} · ผลจากการวิเคราะห์ในเครื่อง อาจคลาดเคลื่อน โปรดตรวจและแก้ไขก่อนโพสต์`,
        confidenceScore:Math.min(0.99,hit.prob),suggestedTags:[hit.cat,hit.th,color]};
    }else{
      res={itemName:top?`สิ่งของ (${top.className.split(',')[0]})`:`สิ่งของ ${color}`,category:'อื่น ๆ',color,brand:'ไม่ระบุ',
        distinctiveFeatures:modelOk
          ?`ยังจำแนกชนิดไม่ได้ชัดเจน สีเด่นคือ${color.replace('สี','')} · ลองถ่ายให้เห็นสิ่งของเต็มกรอบบนพื้นเรียบ หรือกรอกรายละเอียดเอง`
          :`โหลดโมเดลวิเคราะห์ไม่ได้ (ต้องต่ออินเทอร์เน็ต) จึงอ่านได้เฉพาะสีเด่น: ${color.replace('สี','')} · กรุณากรอกชนิดสิ่งของเอง`,
        confidenceScore:top?Math.min(0.5,top.probability):0.1,suggestedTags:[color]};
    }
    return res;
  }

  /* ---------- กล้อง ---------- */
  let stream=null,video=null;
  const live=()=>!!(stream&&video&&video.parentNode);
  async function startCam(){
    if(live())return;
    const img=document.querySelector('img[alt="Camera stream"]');
    if(!img)return;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('ไม่รองรับกล้อง');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    video=document.createElement('video');
    video.autoplay=true;video.muted=true;video.setAttribute('playsinline','');
    video.className='absolute inset-0 w-full h-full object-cover';video.id='swu-cam';
    video.srcObject=stream;
    img.style.visibility='hidden';
    img.parentNode.insertBefore(video,img.nextSibling);
    await video.play().catch(()=>{});
  }
  function stopCam(){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    if(video){video.remove();video=null;}
    const img=document.querySelector('img[alt="Camera stream"]');
    if(img)img.style.visibility='';
  }
  function snap(){
    const k=Math.min(1,800/Math.max(video.videoWidth||800,video.videoHeight||600));
    const c=document.createElement('canvas');
    c.width=Math.round((video.videoWidth||800)*k);c.height=Math.round((video.videoHeight||600)*k);
    c.getContext('2d').drawImage(video,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.85);
  }

  /* ปุ่มชัตเตอร์ (ถูกเรียกจากหน้าสแกน) */
  window.__swuShutter=async(cur,run,setImg,fileRef,toast)=>{
    if(live()){const url=snap();stopCam();setImg(url);run(url);return;}
    if(cur&&!cur.startsWith('data:image/svg')){run(cur);return;}
    try{await startCam();toast('เปิดกล้องแล้ว กดปุ่มอีกครั้งเพื่อถ่ายภาพ');}
    catch(e){toast('เปิดกล้องไม่ได้ เลือกรูปจากแกลเลอรี่แทน');if(fileRef&&fileRef.current)fileRef.current.click();}
  };
  window.__swuScanAnalyze=analyze;
  window.__swuStop=stopCam;
  window.__swuRestartCam=()=>setTimeout(()=>{startCam().catch(()=>{});},80);
  /* ย่อรูปที่จะแนบเป็นรูปประกาศ (รูปจากกล้องมือถือใหญ่หลาย MB) */
  async function shrink(dataUrl,max=800){
    try{
      const im=await loadImage(dataUrl),k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85);
    }catch{return dataUrl;}
  }

  /* เปิดหน้าสแกน = เปิดกล้องอัตโนมัติ + โหลดโมเดลรอไว้ / ออกจากหน้า = ปิดกล้อง */
  let wasOn=false;
  new MutationObserver(()=>{
    const img=document.querySelector('img[alt="Camera stream"]');
    if(img&&!wasOn){
      wasOn=true;
      model().catch(()=>{});
      if(img.src.startsWith('data:image/svg'))startCam().catch(()=>{});
    }else if(!img&&wasOn){wasOn=false;stopCam();}
  }).observe(document.body,{childList:true,subtree:true});

  /* ---------- ดักการเรียก API สแกน ---------- */
  const prev=window.fetch.bind(window);
  window.fetch=async(input,opts={})=>{
    const url=typeof input==='string'?input:input.url;
    if(url==='/api/gemini/scan-item'&&(opts.method||'GET').toUpperCase()==='POST'){
      const body=JSON.parse(opts.body||'{}');
      const out=await analyze(body.imageBase64);
      window.__swuLastShrunk=await shrink(body.imageBase64);
      return new Response(JSON.stringify(out),{status:200,headers:{'Content-Type':'application/json'}});
    }
    return prev(input,opts);
  };
})();
</script>
