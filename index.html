<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Lost & Found – ของหายได้คืน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--b:#2f6fe4;--b2:#1d4fb8;--bl:#e8f1ff;--bl2:#d3e5ff;--bg:#eef5ff;--tx:#17325c;--mu:#6a82a8;--ln:#d6e4fa;--w:#fff;--rd:#e5484d;--gr:#1fa971;--am:#f0a020;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px 'Prompt',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px}
@media(min-width:700px){body{background:linear-gradient(135deg,#cfe2ff,#eaf3ff)}#app{margin:20px auto;min-height:calc(100vh - 40px);border-radius:28px;box-shadow:0 20px 60px #2f6fe433;overflow:hidden}}
.bar{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:var(--w);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}
.bar h2{font-size:17px;font-weight:600;flex:1}.ib{border:0;background:var(--bl);color:var(--b);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer;position:relative}
.dot{position:absolute;top:5px;right:6px;width:9px;height:9px;background:var(--rd);border-radius:50%}
main{padding:14px}
.card{background:var(--w);border:1px solid var(--ln);border-radius:18px;padding:12px;margin-bottom:12px}
.in,select,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--w);color:var(--tx);font:inherit}
label.l{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}label.l i{color:var(--rd);font-style:normal}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--b);color:#fff;font:inherit;font-weight:500;cursor:pointer;text-align:center;margin-top:12px}
.btn.o{background:var(--w);color:var(--b);border:1.5px solid var(--b)}.btn.g{background:var(--gr)}
.seg{display:flex;background:var(--bl2);border-radius:14px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:12px;font:inherit;color:var(--b);cursor:pointer}.seg .on{background:var(--b);color:#fff}
.tag{display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:99px;font-weight:500}.t-lost{background:#ffe5e6;color:var(--rd)}.t-found{background:#dcf7ea;color:var(--gr)}.t-done{background:var(--bl2);color:var(--mu)}
.it{display:flex;gap:12px;align-items:center;cursor:pointer}.th{width:68px;height:68px;border-radius:14px;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;object-fit:cover}
.it h3{font-size:15px;font-weight:500;margin:3px 0}.mu{font-size:12.5px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.cat{text-align:center;font-size:11.5px;cursor:pointer;border:0;background:none;color:var(--tx);font-family:inherit}.cat span{display:flex;width:52px;height:52px;margin:0 auto 4px;border-radius:16px;background:var(--bl2);align-items:center;justify-content:center;font-size:24px}.cat.on span{background:var(--b)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-weight:600}.hd a{font-size:13px;color:var(--b);font-weight:400;cursor:pointer}
.ban{background:linear-gradient(135deg,var(--b),#5b9bff);color:#fff;border-radius:18px;padding:14px;margin-top:12px}.ban b{display:block;margin-bottom:4px}.ban small{opacity:.9}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--w);border-top:1px solid var(--ln);display:flex;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--b);font-weight:600}
nav .fab{flex:none;width:54px;height:54px;border-radius:50%;background:var(--b);color:#fff;font-size:28px;margin:0 8px;margin-top:-22px;box-shadow:0 6px 16px #2f6fe466;justify-content:center;flex-direction:row}
.up{display:flex;gap:10px}.up label{flex:1;border:1.5px dashed var(--b);background:var(--bl);color:var(--b);border-radius:14px;padding:18px 6px;text-align:center;font-size:13px;cursor:pointer}.up label i{display:block;font-size:26px;font-style:normal}
.hero{height:230px;background:var(--bl2);display:flex;align-items:center;justify-content:center;font-size:90px;position:relative;background-size:cover;background-position:center}
.row{display:flex;gap:8px;margin:7px 0;font-size:14px}.row b{color:var(--mu);font-weight:400;min-width:84px}
.msgs{display:flex;flex-direction:column;gap:8px;padding:14px 14px 100px}.m{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px}.m.me{align-self:flex-end;background:var(--b);color:#fff;border-bottom-right-radius:4px}.m.o{align-self:flex-start;background:var(--w);border:1px solid var(--ln);border-bottom-left-radius:4px}
.cb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--w);border-top:1px solid var(--ln);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:9}
.map{height:340px;border-radius:18px;position:relative;overflow:hidden;border:1px solid var(--ln);background:linear-gradient(90deg,#fff6 2px,transparent 2px) 0 0/48px 48px,linear-gradient(#fff6 2px,transparent 2px) 0 0/48px 48px,linear-gradient(160deg,#cfe5ff,#dff0e4)}
.pin{position:absolute;transform:translate(-50%,-100%);font-size:30px;cursor:pointer;border:0;background:none;filter:drop-shadow(0 3px 3px #0003)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px;font-size:13px}.cal .h{color:var(--mu);font-size:12px;padding:6px 0}.cal button{border:0;background:none;padding:7px 0;border-radius:50%;font:inherit;color:var(--tx);cursor:pointer;position:relative;aspect-ratio:1}.cal .sel{background:var(--b);color:#fff}.cal .td{outline:1.5px solid var(--b)}.cal .has::after{content:'';position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--am)}
.scan{background:#0b1a33;min-height:100vh;color:#fff}.vf{margin:20px;aspect-ratio:1;border:3px solid #7fb0ff;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:70px;background-size:cover;background-position:center;overflow:hidden}
.sc{display:flex;justify-content:space-around;align-items:center;padding:18px}.sc label,.sc button{color:#fff;background:none;border:0;font:inherit;font-size:12px;text-align:center;cursor:pointer}.sc i{display:block;font-style:normal;font-size:26px}.shut{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:var(--b)!important}
.mn{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--ln);cursor:pointer}.mn:last-child{border:0}.mn span:nth-child(2){flex:1}.mn i{font-style:normal;color:var(--b);font-size:19px;width:28px}
.stat{display:flex;text-align:center}.stat div{flex:1}.stat b{display:block;font-size:22px;color:var(--b)}
.av{width:64px;height:64px;border-radius:50%;background:var(--bl2);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 6px}
.vr{display:flex;gap:12px;align-items:center;cursor:pointer}.vr i{font-style:normal;font-size:24px}.ck{margin-left:auto;font-size:13px;color:var(--gr)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:50}
.logo{text-align:center;padding:36px 0 10px}.logo .lg{font-size:70px}.logo h1{font-size:30px;line-height:1.1;color:var(--b)}.logo p{color:var(--mu);margin-top:4px}
.sheet{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:var(--bg);width:100%;max-width:480px;max-height:80vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
</style>
</head>
<body>
<div id="app"><div id="v"></div><nav id="nv"></nav></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['👜','กระเป๋า'],['📱','มือถือ'],['🔑','กุญแจ'],['🪪','บัตรนักศึกษา'],['📓','เอกสาร'],['👕','เครื่องแต่งกาย'],['✏️','อุปกรณ์การเรียน'],['⋯','อื่นๆ']];
const PL={'ห้องสมุดกลาง':[30,35],'อาคารเรียนรวม':[62,28],'โรงอาหารกลาง':[45,62],'อาคารกิจกรรมนิสิต':[75,60],'ลานจอดรถ':[20,75],'ป้ายรถรับส่ง':[82,85]};
const D=864e5,now=Date.now();
const seed=()=>({items:[
{id:1,type:'lost',cat:0,title:'กระเป๋าสตางค์',desc:'กระเป๋าสตางค์หนังสีดำ ยี่ห้อ Uniqlo ภายในมีบัตรนักศึกษาและเงินสดส่วนหนึ่ง',place:'ห้องสมุดกลาง',d:now-1*D,contact:'LINE: nong_ta',by:'นักศึกษา ก.',st:'open'},
{id:2,type:'found',cat:1,title:'โทรศัพท์มือถือ',desc:'iPhone สีน้ำเงิน เคสใส เก็บได้ที่ใต้โต๊ะ ฝากไว้ที่จุดบริการนิสิตแล้ว',place:'โรงอาหารกลาง',d:now-2*D,contact:'โทร 081-234-5678',by:'นักศึกษา ข.',st:'open'},
{id:3,type:'found',cat:2,title:'กุญแจ',desc:'พวงกุญแจห้อยตุ๊กตาหมี 3 ดอก มีรีโมทรถ',place:'ลานจอดรถ',d:now-3*D,contact:'IG: swu.keys',by:'นักศึกษา ค.',st:'open'},
{id:4,type:'lost',cat:6,title:'กล่องดินสอสีเขียว',desc:'มีปากกาและยางลบอยู่ข้างใน',place:'อาคารเรียนรวม',d:now-0*D,contact:'LINE: pim99',by:'นักศึกษา ง.',st:'open'}],
chats:{},verified:{},saved:[],next:10,user:null});
let S;try{S=JSON.parse(localStorage.getItem('slf')||'null')}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem('slf',JSON.stringify(S))}catch(e){toast('พื้นที่เก็บข้อมูลเต็ม')}};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}
const fd=(t,o)=>new Date(t).toLocaleDateString('th-TH',o||{day:'numeric',month:'short',year:'numeric'}),ft=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),dk=t=>{const x=new Date(t);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
const get=id=>S.items.find(i=>i.id==id);
function readImg(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)}
const bar=(t,back,extra)=>`<div class="bar">${back?'<button class="ib" onclick="history.back()">‹</button>':''}<h2>${t}</h2>${extra||''}</div>`;
const thumb=i=>i.img?`<img class="th" src="${i.img}" alt="">`:`<div class="th">${CATS[i.cat][0]}</div>`;
const tag=i=>i.st==='done'?'<span class="tag t-done">ส่งคืนแล้ว</span>':`<span class="tag t-${i.type}">${i.type==='lost'?'ของหาย':'ของที่เก็บได้'}</span>`;
const itemRow=i=>`<div class="card it" onclick="location.hash='item-${i.id}'">${thumb(i)}<div style="min-width:0">${tag(i)}<h3>${esc(i.title)}</h3><div class="mu">พบที่: ${esc(i.place)}<br>${fd(i.d)} ${ft(i.d)} น.</div></div></div>`;
let F={type:'lost',cat:'',title:'',desc:'',place:'',date:'',time:'',contact:'',img:''},q='',fc=-1,cm=new Date(),cs=dk(now),ctab='all',nt='all',scanImg='',msel='';

/* 1 login */
function login(reg){return`<main><div class="logo"><div class="lg">🎒</div><h1>Smart<br>Lost & Found</h1><p>“ของหายได้คืน”</p></div>
<div class="card">${reg?'<label class="l">ชื่อ-นามสกุล</label><input class="in" id="nm" placeholder="เช่น นักศึกษา ก.">':''}<label class="l">อีเมลมหาวิทยาลัย</label><input class="in" id="em" placeholder="name@g.swu.ac.th"><label class="l">รหัสผ่าน</label><input class="in" id="pw" type="password">
<button class="btn" onclick="doLogin(${reg?1:0})">${reg?'สมัครสมาชิก':'เข้าสู่ระบบ'}</button><button class="btn o" onclick="location.hash='${reg?'login':'register'}'">${reg?'มีบัญชีแล้ว เข้าสู่ระบบ':'สมัครสมาชิก'}</button></div>
<p class="mu" style="text-align:center">หรือเข้าสู่ระบบด้วย</p><div class="up" style="margin-top:8px"><label onclick="doLogin(2)">G<br>Google</label><label onclick="doLogin(2)"><i>🍎</i>Apple</label><label onclick="doLogin(2)"><i>🎓</i>มศว</label></div></main>`}
function doLogin(m){const em=$('#em')?$('#em').value.trim():'';if(m<2&&!em){toast('กรอกอีเมลมหาวิทยาลัย');return}S.user={name:($('#nm')&&$('#nm').value)||'นักศึกษา ก.',email:em||'student@g.swu.ac.th'};save();location.hash='home'}

/* 2 home */
function home(){const l=listHome();return`${bar('Smart Lost & Found',0,'<button class="ib" onclick="location.hash=\'scan\'">📷</button><button class="ib" onclick="location.hash=\'notif\'">🔔<span class="dot"></span></button>')}<main>
<input class="in" id="q" placeholder="🔎 ค้นหาของหาย / ของที่เก็บได้" value="${esc(q)}" oninput="q=this.value;$('#lst').innerHTML=listHome()">
<div class="ban"><b>📢 ประชาสัมพันธ์</b>ประกาศ: พบกระเป๋าสตางค์ ที่ห้องสมุดกลาง ชั้น 1<br><small>${fd(now)}</small></div>
<div class="grid">${CATS.map((c,i)=>`<button class="cat ${fc===i?'on':''}" onclick="fc=fc===${i}?-1:${i};render()"><span>${c[0]}</span>${c[1]}</button>`).join('')}</div>
<div class="hd">ของหายล่าสุด<a onclick="q='';fc=-1;render()">ดูทั้งหมด</a></div><div id="lst">${l}</div></main>`}
function listHome(){const w=q.toLowerCase().split(/\s+/).filter(Boolean);const a=S.items.filter(i=>(fc<0||i.cat===fc)&&w.every(x=>(i.title+i.desc+i.place+CATS[i.cat][1]).toLowerCase().includes(x))).sort((a,b)=>(a.st==='done')-(b.st==='done')||b.d-a.d);return a.length?a.map(itemRow).join(''):'<div class="mu" style="text-align:center;padding:30px">ไม่พบรายการ ลองเปลี่ยนคำค้นหา หรือประกาศใหม่</div>'}

/* 3 post */
function post(){return`${bar('ประกาศ / สร้างโพสต์')}<main><div class="seg"><button class="${F.type==='lost'?'on':''}" onclick="sf();F.type='lost';render()">ประกาศของหาย</button><button class="${F.type==='found'?'on':''}" onclick="sf();F.type='found';render()">ประกาศของที่เก็บได้</button></div>
<label class="l">เพิ่มรูปภาพ</label><div class="up"><label><i>📷</i>ถ่ายรูป / เลือกรูป<input type="file" accept="image/*" capture="environment" hidden onchange="pk(this)"></label><label><i>⬆️</i>อัปโหลด<input type="file" accept="image/*" hidden onchange="pk(this)"></label></div>${F.img?`<img src="${F.img}" alt="" style="width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-top:8px">`:''}
<label class="l">หมวดหมู่ <i>*</i></label><select id="cat"><option value="">เลือกหมวดหมู่</option>${CATS.map((c,i)=>`<option value="${i}" ${F.cat==i&&F.cat!==''?'selected':''}>${c[0]} ${c[1]}</option>`).join('')}</select>
<label class="l">ชื่อสิ่งของ <i>*</i></label><input class="in" id="title" placeholder="เช่น กระเป๋าสตางค์สีดำ" value="${esc(F.title)}">
<label class="l">รายละเอียดของสิ่งของ <i>*</i></label><textarea id="desc" rows="3" placeholder="สี ยี่ห้อ ลักษณะเด่น">${esc(F.desc)}</textarea>
<label class="l">สถานที่ที่พบ <i>*</i></label><select id="place"><option value="">เลือกสถานที่</option>${Object.keys(PL).map(p=>`<option ${F.place===p?'selected':''}>${p}</option>`).join('')}</select>
<label class="l">วันที่พบ <i>*</i></label><div class="up"><input class="in" type="date" id="date" value="${F.date}"><input class="in" type="time" id="time" value="${F.time}"></div>
<label class="l">ช่องทางติดต่อ (ถ้ามี)</label><input class="in" id="contact" placeholder="เบอร์โทร / Line / อื่นๆ" value="${esc(F.contact)}"><button class="btn" onclick="submitPost()">โพสต์ประกาศ</button></main>`}
function sf(){['cat','title','desc','place','date','time','contact'].forEach(k=>{const e=$('#'+k);if(e)F[k]=e.value})}
function pk(i){if(!i.files[0])return;sf();readImg(i.files[0],d=>{F.img=d;render()})}
function submitPost(){sf();if(F.cat===''||!F.title||!F.desc||!F.place||!F.date){toast('กรอกข้อมูลที่มี * ให้ครบ');return}
const t=new Date(F.date+'T'+(F.time||'12:00')).getTime();const it={id:S.next++,type:F.type,cat:+F.cat,title:F.title,desc:F.desc,place:F.place,d:t,contact:F.contact||'ติดต่อผ่านแชท',by:(S.user&&S.user.name)||'นักศึกษา ก.',st:'open',img:F.img,mine:1};S.items.unshift(it);save();F={type:F.type,cat:'',title:'',desc:'',place:'',date:'',time:'',contact:'',img:''};toast('โพสต์เรียบร้อย ✓');location.hash='item-'+it.id}

/* 4 item */
function item(id){const i=get(id);if(!i)return bar('ไม่พบรายการ',1)+'<main class="mu">รายการนี้ถูกลบแล้ว</main>';const sv=S.saved.includes(i.id);
const sim=S.items.filter(o=>o.id!==i.id&&o.type!==i.type&&o.st==='open'&&(o.cat===i.cat||o.place===i.place)).slice(0,2);
return`<div class="hero" ${i.img?`style="background-image:url(${i.img})"`:''}>${i.img?'':CATS[i.cat][0]}<button class="ib" style="position:absolute;top:14px;left:14px" onclick="history.back()">‹</button></div><main>
<h2 style="font-size:20px;font-weight:600">${esc(i.title)} ${tag(i)}</h2>
<div class="row"><b>📂 หมวดหมู่</b>${CATS[i.cat][1]}</div><div class="row"><b>🕒 วันที่พบ</b>${fd(i.d)} เวลา ${ft(i.d)} น.</div><div class="row"><b>📍 สถานที่พบ</b>${esc(i.place)}</div>
<div class="card" style="margin-top:10px"><b>รายละเอียดเพิ่มเติม</b><p class="mu" style="margin-top:6px">${esc(i.desc)}</p></div>
<div class="card it"><div class="th" style="border-radius:50%">👤</div><div><b>ผู้ประกาศ</b><div class="mu">${esc(i.by)} · นักศึกษา มศว${S.verified.id?' · ✅ ยืนยันตัวตนแล้ว':''}</div><div class="mu">ติดต่อ: ${esc(i.contact)}</div></div></div>
${sim.length?`<div class="hd">✨ รายการที่อาจตรงกัน</div>${sim.map(itemRow).join('')}`:''}
<div class="up"><button class="btn" onclick="location.hash='chat-${i.id}'">💬 ติดต่อผู้ประกาศ</button><button class="btn o" onclick="tsv(${i.id})">${sv?'💙 บันทึกแล้ว':'🤍 บันทึก'}</button></div>
${i.st==='open'?`<button class="btn g" onclick="dn(${i.id})">${i.type==='lost'?'ได้ของคืนแล้ว':'ส่งคืนเจ้าของแล้ว'}</button>`:''}
<button class="btn o" style="color:var(--rd);border-color:var(--rd)" onclick="rm(${i.id})">ลบประกาศ</button></main>`}
function tsv(id){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];save();render()}
function dn(id){get(id).st='done';save();toast('ปิดประกาศแล้ว 🎉');render()}
function rm(id){if(!confirm('ลบประกาศนี้?'))return;S.items=S.items.filter(i=>i.id!==id);save();location.hash='home'}

/* 5 chat */
function chat(id){const i=get(id);if(!i)return'';const m=S.chats[id]||(S.chats[id]=[{w:'o',t:'สวัสดีค่ะ ยังอยู่ไหมคะ เรื่อง'+i.title}]);
return`${bar(esc(i.by),1)}<div class="card it" style="margin:10px 14px 0" onclick="location.hash='item-${i.id}'">${thumb(i)}<div><b>${esc(i.title)}</b><div class="mu">พบที่: ${esc(i.place)}</div></div></div>
<div class="msgs" id="ms">${m.map(x=>`<div class="m ${x.w}">${esc(x.t)}</div>`).join('')}</div>
<div class="cb"><input class="in" id="cmsg" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key==='Enter')send(${id})"><button class="ib" style="background:var(--b);color:#fff" onclick="send(${id})">➤</button></div>`}
function send(id){const e=$('#cmsg'),t=e.value.trim();if(!t)return;S.chats[id].push({w:'me',t});save();render();setTimeout(()=>{S.chats[id].push({w:'o',t:'ได้ค่ะ นัดรับที่จุดบริการนิสิตหรือห้องสมุดได้ไหมคะ'});save();if(location.hash==='#chat-'+id)render()},700)}

/* 6 map */
function map(){const sh=msel&&S.items.filter(i=>i.place===msel&&i.st==='open');return`${bar('แผนที่ตำแหน่งที่พบของ')}<main><div class="map">${Object.entries(PL).map(([p,[x,y]])=>{const n=S.items.filter(i=>i.place===p&&i.st==='open').length;return n?`<button class="pin" style="left:${x}%;top:${y}%" onclick="msel='${p}';render()">📍</button>`:''}).join('')}</div>
${msel?`<div class="hd">${msel}</div>${sh.map(itemRow).join('')}`:'<p class="mu" style="margin-top:10px">แตะหมุดบนแผนที่เพื่อดูรายการที่พบในบริเวณนั้น</p>'}
<div class="hd">สถานที่ทั้งหมด</div>${Object.keys(PL).map(p=>`<div class="card" onclick="msel='${p}';render()" style="cursor:pointer">📍 ${p} <span class="mu">· ${S.items.filter(i=>i.place===p&&i.st==='open').length} รายการ</span></div>`).join('')}</main>`}

/* 7 calendar */
function cal(){const y=cm.getFullYear(),mo=cm.getMonth(),first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate(),has=new Set(S.items.map(i=>dk(i.d)));let c=['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="h">${d}</div>`).join('')+'<span></span>'.repeat(first);
for(let d=1;d<=dim;d++){const k=y+'-'+(mo+1)+'-'+d;c+=`<button class="${has.has(k)?'has':''} ${k===cs?'sel':''} ${k===dk(now)?'td':''}" onclick="cs='${k}';render()">${d}</button>`}
const dl=S.items.filter(i=>dk(i.d)===cs);return`${bar('ปฏิทินตามหาของ')}<main><div class="card"><div class="hd" style="margin-top:0"><button class="ib" onclick="cm=new Date(${y},${mo-1},1);render()">‹</button>${fd(cm,{month:'long',year:'numeric'})}<button class="ib" onclick="cm=new Date(${y},${mo+1},1);render()">›</button></div><div class="cal">${c}</div><p class="mu" style="margin-top:8px">🟠 มีรายการของหาย/ของที่เก็บได้</p></div>
<div class="hd">รายการตามหาวันนี้ <a onclick="location.hash='event-${cs}'">ดูทั้งหมด</a></div>${dl.length?dl.map(itemRow).join(''):'<p class="mu">ไม่มีรายการในวันที่เลือก</p>'}</main>`}
/* 8 day detail */
function event(k){const [y,m,d]=k.split('-').map(Number),dl=S.items.filter(i=>dk(i.d)===k);return`${bar('กิจกรรมตามหาของ',1)}<main><div class="card"><b>📅 ${fd(new Date(y,m-1,d),{day:'numeric',month:'long',year:'numeric'})}</b><div class="mu" style="margin-top:4px">ของที่เกี่ยวข้อง (${dl.length} รายการ)</div></div>${dl.length?dl.map(itemRow).join(''):'<p class="mu">ยังไม่มีรายการในวันนี้</p>'}</main>`}

/* 9 scan */
function scan(){return`<div class="scan"><div class="bar" style="background:none;border:0"><button class="ib" onclick="history.back()">‹</button><h2>สแกนรูปเพื่อค้นหา</h2></div><div class="vf" ${scanImg?`style="background-image:url(${scanImg})"`:''}>${scanImg?'':'📷'}</div>
<p class="mu" style="text-align:center;color:#9fc0f5">ถ่ายหรือเลือกรูปสิ่งของ เพื่อดูรายการที่คล้ายกัน</p>
<div class="sc"><label><i>🖼️</i>แกลเลอรี<input type="file" accept="image/*" hidden onchange="sp(this)"></label><label class="shut" style="display:block"><input type="file" accept="image/*" capture="environment" hidden onchange="sp(this)"></label><button onclick="toast('ไฟแฟลชขึ้นอยู่กับอุปกรณ์')"><i>⚡</i>แฟลช</button></div>
${scanImg?'<div style="padding:0 20px"><button class="btn" onclick="scanRes()">ค้นหาของที่คล้ายกัน</button></div>':''}</div>`}
function sp(i){if(i.files[0])readImg(i.files[0],d=>{scanImg=d;render()})}
function scanRes(){const r=S.items.filter(i=>i.st==='open').slice(0,3);const e=document.createElement('div');e.className='sheet';e.onclick=x=>{if(x.target===e)e.remove()};e.innerHTML=`<div><div class="hd" style="margin-top:0">ผลการค้นหา (ตัวอย่างเดโม)</div><p class="mu" style="margin-bottom:10px">เวอร์ชันนี้ยังไม่ได้เชื่อม AI วิเคราะห์ภาพจริง จึงแสดงรายการล่าสุดเป็นตัวอย่าง</p>${r.map((i,n)=>itemRow(i).replace('</h3>',`</h3><span class="mu">ความคล้าย ${90-n*12}%</span>`)).join('')}</div>`;document.body.appendChild(e)}

/* 10 profile */
function me(){const u=S.user||{name:'นักศึกษา ก.',email:'student@g.swu.ac.th'},mine=S.items.filter(i=>i.mine);return`${bar('โปรไฟล์ / ประวัติประกาศ',0,'<button class="ib" onclick="location.hash=\'prefs\'">⚙️</button>')}<main><div class="card" style="text-align:center"><div class="av">👩‍🎓</div><b>${esc(u.name)}</b><div class="mu">นักศึกษา มศว · ${esc(u.email)}</div></div>
<div class="card stat"><div><b>${S.items.filter(i=>i.type==='lost').length}</b><span class="mu">ประกาศของหาย</span></div><div><b>${S.items.filter(i=>i.type==='found').length}</b><span class="mu">ของที่เก็บได้</span></div><div><b>${S.items.filter(i=>i.st==='done').length}</b><span class="mu">ได้คืนแล้ว</span></div></div>
<div class="card"><div class="mn" onclick="location.hash='hist'"><i>📄</i><span>ประวัติประกาศ</span>›</div><div class="mn" onclick="location.hash='saved'"><i>💙</i><span>รายการที่บันทึกไว้ (${S.saved.length})</span>›</div><div class="mn" onclick="location.hash='prefs'"><i>⚙️</i><span>ตั้งค่า</span>›</div><div class="mn" onclick="location.hash='verify'"><i>✅</i><span>ยืนยันตัวตน</span><span class="tag ${S.verified.id?'t-found':'t-done'}">${S.verified.id?'ยืนยันแล้ว':'ยังไม่ยืนยัน'}</span></div></div></main>`}
const hist=()=>bar('ประวัติประกาศ',1)+'<main>'+(S.items.filter(i=>i.mine).map(itemRow).join('')||'<p class="mu" style="text-align:center;padding:30px">ยังไม่มีประกาศของคุณ กดปุ่ม + เพื่อสร้างประกาศแรก</p>')+'</main>';
const saved=()=>bar('รายการที่บันทึกไว้',1)+'<main>'+(S.items.filter(i=>S.saved.includes(i.id)).map(itemRow).join('')||'<p class="mu" style="text-align:center;padding:30px">ยังไม่มีรายการที่บันทึก</p>')+'</main>';

/* 11 verify */
function verify(){const o=[['id','🪪','บัตรนักศึกษา มศว'],['nat','🆔','บัตรประชาชน'],['mail','📧','อีเมลมหาวิทยาลัย / อีเมลส่วนตัว']];return`${bar('ยืนยันตัวตน',1)}<main><div style="text-align:center;font-size:60px">🛡️</div><h2 style="text-align:center;font-size:18px">ยืนยันตัวตน</h2><p class="mu" style="text-align:center;margin:6px 0 14px">เพื่อความปลอดภัยและความน่าเชื่อถือในการรับของ กรุณายืนยันตัวตนอย่างน้อยหนึ่งวิธี</p>
${o.map(([k,i,t])=>`<div class="card vr" onclick="S.verified.${k}=!S.verified.${k};save();render()"><i>${i}</i>${t}<span class="ck">${S.verified[k]?'✓ เลือกแล้ว':'›'}</span></div>`).join('')}
<button class="btn" onclick="if(!(S.verified.id||S.verified.nat||S.verified.mail)){toast('เลือกอย่างน้อย 1 วิธี');return}S.verified.id=true;save();toast('ยืนยันตัวตนเรียบร้อย ✓');location.hash='me'">ยืนยัน</button></main>`}

/* 12 notifications */
function notif(){const N=[['found','🔔','พบสิ่งของที่คล้ายกับของที่คุณประกาศ','กระเป๋าสตางค์ · '+ft(now-36e5)],['found','✅','สถานะการรับของได้รับการอัปเดต','ผู้พบยืนยันว่าส่งคืนแล้ว · '+fd(now-D)],['lost','💬','มีข้อความใหม่','จาก นักศึกษา ข. · '+ft(now-9e5)],['sys','📅','ประกาศกิจกรรมตามหาของ','จุดบริการนิสิต เปิดรับของวันนี้ 10.00–16.00 น.'],['sys','ℹ️','ระบบ','ยินดีต้อนรับสู่ Smart Lost & Found']];
const T=[['all','ทั้งหมด'],['lost','ของหาย'],['found','ของที่เก็บได้'],['sys','ระบบ']];return`${bar('แจ้งเตือน',1)}<main><div class="seg" style="overflow-x:auto">${T.map(([k,l])=>`<button class="${nt===k?'on':''}" style="white-space:nowrap" onclick="nt='${k}';render()">${l}</button>`).join('')}</div><div style="margin-top:12px">${N.filter(n=>nt==='all'||n[0]===nt).map(n=>`<div class="card it"><div class="th" style="border-radius:50%">${n[1]}</div><div><b style="font-weight:500">${n[2]}</b><div class="mu">${n[3]}</div></div></div>`).join('')}</div></main>`}

/* 13 prefs */
function prefs(){const u=S.user||{name:'นักศึกษา ก.'};return`${bar('ตั้งค่าโปรไฟล์',1)}<main><div class="card" style="text-align:center"><div class="av">👩‍🎓</div><b>${esc(u.name)}</b><div class="mu">นักศึกษา มศว</div></div>
<div class="card"><div class="mn" onclick="ed()"><i>👤</i><span>ข้อมูลส่วนตัว</span>›</div><div class="mn" onclick="location.hash='verify'"><i>✅</i><span>การยืนยันตัวตน</span>›</div><div class="mn" onclick="location.hash='hist'"><i>📄</i><span>ประวัติประกาศ</span>›</div><div class="mn" onclick="location.hash='notif'"><i>🔔</i><span>การแจ้งเตือน</span>›</div><div class="mn" onclick="toast('ติดต่อ: lostfound@swu.ac.th (ตัวอย่าง)')"><i>🎧</i><span>ติดต่อผู้ดูแล / แจ้งปัญหา</span>›</div><div class="mn" onclick="if(confirm('ล้างข้อมูลตัวอย่างทั้งหมด?')){localStorage.removeItem('slf');S=seed();location.hash='login';render()}"><i>🗑️</i><span>รีเซ็ตข้อมูลเดโม</span>›</div><div class="mn" onclick="S.user=null;save();location.hash='login'"><i>↩️</i><span>ออกจากระบบ</span>›</div></div></main>`}
function ed(){const n=prompt('ชื่อที่แสดง',(S.user&&S.user.name)||'');if(n){S.user=Object.assign(S.user||{email:''},{name:n});save();render()}}

/* router */
const NAV=[['home','🏠','หน้าหลัก'],['map','📍','แผนที่'],['post','+',''],['cal','📅','ปฏิทิน'],['me','👤','โปรไฟล์']];
function render(){const h=location.hash.slice(1)||'login',[r,...rest]=h.split('-'),a=rest.join('-');
const P={login:()=>login(0),register:()=>login(1),home,post,map,cal,me,scan,verify,notif,prefs,hist,saved,item:()=>item(a),chat:()=>chat(a),event:()=>event(a)};
if(!S.user&&!['login','register'].includes(r)){location.hash='login';return}
const y=window.scrollY;$('#v').innerHTML=(P[r]||home)();
const showNav=['home','post','map','cal','me'].includes(r);$('#nv').style.display=showNav?'flex':'none';$('#nv').innerHTML=NAV.map(([k,i,l])=>k==='post'?`<button class="fab" onclick="location.hash='post'">+</button>`:`<button class="${r===k?'on':''}" onclick="location.hash='${k}'"><i>${i}</i>${l}</button>`).join('');
const same=r==='chat'||r==='cal'||r==='map'||r==='home';if(same)window.scrollTo(0,y);else window.scrollTo(0,0);
if(r==='chat'){const m=$('#ms');if(m)window.scrollTo(0,document.body.scrollHeight)}}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
