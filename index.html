<style>
:root{--b:#2f6fe4;--b2:#1d4fb8;--bl:#e8f1ff;--bl2:#d3e5ff;--bg:#eef5ff;--tx:#17325c;--mu:#6a82a8;--ln:#d6e4fa;--w:#fff;--rd:#e5484d;--gr:#1fa971;--am:#f0a020;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px 'Prompt',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px}
@media(min-width:700px){body{background:linear-gradient(135deg,#cfe2ff,#eaf3ff)}#app{margin:20px auto;min-height:calc(100vh - 40px);border-radius:28px;box-shadow:0 20px 60px #2f6fe433;overflow:hidden}}
.bar{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:var(--w);position:sticky;top:0;z-index:500;border-bottom:1px solid var(--ln)}
.bar h2{font-size:17px;font-weight:600;flex:1}.ib{border:0;background:var(--bl);color:var(--b);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.dot{position:absolute;top:3px;right:3px;min-width:18px;height:18px;background:var(--rd);color:#fff;border-radius:9px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--w)}
main{padding:14px}
.card{background:var(--w);border:1px solid var(--ln);border-radius:18px;padding:12px;margin-bottom:12px}
.in,select,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--w);color:var(--tx);font:inherit}
label.l{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}label.l i{color:var(--rd);font-style:normal}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--b);color:#fff;font:inherit;font-weight:500;cursor:pointer;text-align:center;margin-top:12px}
.btn.o{background:var(--w);color:var(--b);border:1.5px solid var(--b)}.btn.g{background:var(--gr)}
.seg{display:flex;background:var(--bl2);border-radius:14px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:12px;font:inherit;color:var(--b);cursor:pointer}.seg .on{background:var(--b);color:#fff}
.tag{display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:99px;font-weight:500}.t-lost{background:#ffe5e6;color:var(--rd)}.t-found{background:#dcf7ea;color:var(--gr)}.t-done{background:var(--bl2);color:var(--mu)}
.it{display:flex;gap:12px;align-items:center;cursor:pointer}.th{width:68px;height:68px;border-radius:14px;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;object-fit:cover}
.it h3{font-size:15px;font-weight:500;margin:3px 0}.mu{font-size:12.5px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.cat{text-align:center;font-size:11.5px;cursor:pointer;border:0;background:none;color:var(--tx);font-family:inherit}.cat span{display:flex;width:52px;height:52px;margin:0 auto 4px;border-radius:16px;background:var(--bl2);align-items:center;justify-content:center;font-size:24px}.cat.on span{background:var(--b)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-weight:600}.hd a{font-size:13px;color:var(--b);font-weight:400;cursor:pointer}
.ban{background:linear-gradient(135deg,var(--b),#5b9bff);color:#fff;border-radius:18px;padding:14px;margin-top:12px}.ban b{display:block;margin-bottom:4px}.ban small{opacity:.9}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--w);border-top:1px solid var(--ln);display:flex;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:900}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--b);font-weight:600}
nav .fab{flex:none;width:54px;height:54px;border-radius:50%;background:var(--b);color:#fff;font-size:28px;margin:0 8px;margin-top:-22px;box-shadow:0 6px 16px #2f6fe466;justify-content:center;flex-direction:row}
.up{display:flex;gap:10px}.up label{flex:1;border:1.5px dashed var(--b);background:var(--bl);color:var(--b);border-radius:14px;padding:18px 6px;text-align:center;font-size:13px;cursor:pointer}.up label i{display:block;font-size:26px;font-style:normal}
.hero{height:230px;background:var(--bl2);display:flex;align-items:center;justify-content:center;font-size:90px;position:relative;background-size:cover;background-position:center}
.row{display:flex;gap:8px;margin:7px 0;font-size:14px}.row b{color:var(--mu);font-weight:400;min-width:84px}
.msgs{display:flex;flex-direction:column;gap:8px;padding:14px 14px 100px}.m{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px}.m.me{align-self:flex-end;background:var(--b);color:#fff;border-bottom-right-radius:4px}.m.o{align-self:flex-start;background:var(--w);border:1px solid var(--ln);border-bottom-left-radius:4px}
.cb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--w);border-top:1px solid var(--ln);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:900}
#map-container{height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--ln);z-index:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px;font-size:13px}.cal .h{color:var(--mu);font-size:12px;padding:6px 0}.cal button{border:0;background:none;padding:7px 0;border-radius:50%;font:inherit;color:var(--tx);cursor:pointer;position:relative;aspect-ratio:1}.cal .sel{background:var(--b);color:#fff}.cal .td{outline:1.5px solid var(--b)}.cal .has::after{content:'';position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--am)}
.scan{background:#0b1a33;min-height:100vh;color:#fff}.vf{margin:20px;aspect-ratio:1;border:3px solid #7fb0ff;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:70px;background-size:cover;background-position:center;overflow:hidden}
.sc{display:flex;justify-content:space-around;align-items:center;padding:18px}.sc label,.sc button{color:#fff;background:none;border:0;font:inherit;font-size:12px;text-align:center;cursor:pointer}.sc i{display:block;font-style:normal;font-size:26px}.shut{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:var(--b)!important}
.mn{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--ln);cursor:pointer}.mn:last-child{border:0}.mn span:nth-child(2){flex:1}.mn i{font-style:normal;color:var(--b);font-size:19px;width:28px}
.stat{display:flex;text-align:center}.stat div{flex:1}.stat b{display:block;font-size:22px;color:var(--b)}
.av{width:80px;height:80px;border-radius:50%;background:var(--bl2);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 10px;object-fit:cover;border:3px solid var(--b);cursor:pointer}
.avatar-preset-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
.avatar-option{font-size:32px;padding:8px;border-radius:12px;background:var(--bl);text-align:center;cursor:pointer;border:2px solid transparent}
.avatar-option.selected{border-color:var(--b);background:var(--bl2)}
.vr{display:flex;gap:12px;align-items:center;cursor:pointer}.vr i{font-style:normal;font-size:24px}.ck{margin-left:auto;font-size:13px;color:var(--gr)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:9999;box-shadow:0 4px 12px #0004;animation:fadeIn 0.2s}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
.logo{text-align:center;padding:36px 0 10px}.logo .lg{font-size:70px}.logo h1{font-size:30px;line-height:1.1;color:var(--b)}.logo p{color:var(--mu);margin-top:4px}
.sheet{position:fixed;inset:0;background:#0006;z-index:950;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:var(--bg);width:100%;max-width:480px;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
.notif-card{background:var(--w);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform 0.1s}
.notif-card:active{transform:scale(0.98)}
.notif-card.unread{border-left:4px solid var(--b);background:#f4f8ff}
</style>
</head>

<div id="app"><div id="v"></div><nav id="nv"></nav></div>

<!-- Leaflet JS for Real Interactive Map -->

<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['👜','กระเป๋า'],['📱','มือถือ'],['🔑','กุญแจ'],['🪪','บัตรนักศึกษา'],['📓','เอกสาร'],['👕','เครื่องแต่งกาย'],['✏️','อุปกรณ์การเรียน'],['⋯','อื่นๆ']];
const AVATAR_PRESETS=['👩‍🎓','👨‍🎓','🧑‍🎓','👩‍💻','👨‍💻','👩‍🔬','👨‍🔬','👩‍🎨','👨‍🎨','🦊'];

// Real SWU Prasarnmit Map Coordinates
const SWU_CENTER = [13.7462, 100.5651];
const PL = {
  'อาคารเรียนรวม (ตึก 300 ล้าน)': [13.7468, 100.5655],
  'สำนักหอสมุดกลาง': [13.7459, 100.5644],
  'อาคารปฏิบัติการวิทยาศาสตร์ (ตึก 19)': [13.7471, 100.5649],
  'โรงอาหารกลาง (ตึก 23)': [13.7453, 100.5658],
  'อาคารกิจกรรมนิสิต': [13.7450, 100.5648],
  'ลานจอดรถหน้ามหาวิทยาลัย': [13.7445, 100.5642],
  'ป้ายรถรับส่ง / ประตูประสานมิตร': [13.7440, 100.5650]
};

const D=864e5,now=Date.now();
const seed=()=>({
  items:[
    {id:1,type:'lost',cat:0,title:'กระเป๋าสตางค์',desc:'กระเป๋าสตางค์หนังสีดำ ยี่ห้อ Uniqlo ภายในมีบัตรนักศึกษาและเงินสดส่วนหนึ่ง',place:'สำนักหอสมุดกลาง',d:now-1*D,contact:'LINE: nong_ta',by:'นักศึกษา ก.',owner:'ta@g.swu.ac.th',st:'open'},
    {id:2,type:'found',cat:1,title:'โทรศัพท์มือถือ iPhone',desc:'iPhone 15 สีน้ำเงิน เคสใส เก็บได้ที่ใต้โต๊ะ ฝากไว้ที่จุดบริการนิสิตแล้ว',place:'โรงอาหารกลาง (ตึก 23)',d:now-2*D,contact:'โทร 081-234-5678',by:'นักศึกษา ข.',owner:'b@g.swu.ac.th',st:'open'},
    {id:3,type:'found',cat:2,title:'กุญแจรถยนต์',desc:'พวงกุญแจห้อยตุ๊กตาหมี 3 ดอก มีรีโมทรถฮอนด้า',place:'ลานจอดรถหน้ามหาวิทยาลัย',d:now-3*D,contact:'IG: swu.keys',by:'นักศึกษา ค.',owner:'c@g.swu.ac.th',st:'open'},
    {id:4,type:'lost',cat:6,title:'กล่องดินสอสีเขียว',desc:'มีปากกาและยางลบอยู่ข้างใน',place:'อาคารเรียนรวม (ตึก 300 ล้าน)',d:now-0*D,contact:'LINE: pim99',by:'นักศึกษา ง.',owner:'d@g.swu.ac.th',st:'open'}
  ],
  notifications:[
    {id:101,type:'found',title:'พบสิ่งของที่คล้ายกับที่คุณประกาศ',desc:'กระเป๋าสตางค์หนังสีดำ · พบที่สำนักหอสมุดกลาง',time:now-36e5,read:false,target:'item-1'},
    {id:102,type:'chat',title:'มีข้อความใหม่จากผู้พบสิ่งของ',desc:'นักศึกษา ข. ส่งข้อความถึงคุณเกี่ยวกับ iPhone',time:now-9e5,read:false,target:'chat-2'},
    {id:103,type:'sys',title:'การยืนยันตัวตนสำเร็จ',desc:'บัญชีของคุณได้รับตราประทับยืนยันตัวตนแล้ว',time:now-2*D,read:true,target:'verify'}
  ],
  chats:{},
  verified:{id:true,status:'ok',sid:'6610101234',fac:'คณะวิทยาศาสตร์',mail:'thidawal@g.swu.ac.th'},
  saved:[],
  next:10,
  user:{name:'ธิดาวัลย์ รัตนพันธ์',email:'thidawal@g.swu.ac.th',avatar:'👩‍🎓'}
});

let S;
try{S=JSON.parse(localStorage.getItem('slf_v2')||'null')}catch(e){}
if(!S)S=seed();

// Real-time Database Sync Across Tabs
let bc;
if(window.BroadcastChannel){
  bc = new BroadcastChannel('swu_lost_found_channel');
  bc.onmessage = (e) => {
    if(e.data && e.data.type === 'SYNC'){
      S = e.data.payload;
      render();
      toast('🔄 อัปเดตข้อมูลประกาศล่าสุดจากผู้ใช้อื่น');
    }
  };
}

const save=()=>{
  try{
    localStorage.setItem('slf_v2',JSON.stringify(S));
    if(bc) bc.postMessage({type:'SYNC', payload:S});
  }catch(e){toast('พื้นที่เก็บข้อมูลเต็ม')}
};

function toast(m){
  const e=document.createElement('div');
  e.className='toast';
  e.textContent=m;
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),2500);
}

const fd=(t,o)=>new Date(t).toLocaleDateString('th-TH',o||{day:'numeric',month:'short',year:'numeric'}),ft=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),dk=t=>{const x=new Date(t);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
const get=id=>S.items.find(i=>i.id==id);

function readImg(f,cb){
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s;c.height=im.height*s;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',.8));
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}

const bar=(t,back,extra)=>{
  const unreadCount = S.notifications ? S.notifications.filter(n=>!n.read).length : 0;
  return `<div class="bar">
    ${back?'<button class="ib" onclick="history.back()">‹</button>':''}
    <h2>${t}</h2>
    ${extra||`<button class="ib" onclick="location.hash='notif'">🔔${unreadCount?`<span class="dot">${unreadCount}</span>`:''}</button>`}
  </div>`;
};

const userAvatarHeader = (u) => {
  if(!u) return '👤';
  if(u.avatar && u.avatar.startsWith('data:image')) {
    return `<img src="${u.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  }
  return u.avatar || '👩‍🎓';
};

const thumb=i=>i.img?`<img class="th" src="${i.img}" alt="">`:`<div class="th">${CATS[i.cat][0]}</div>`;
const tag=i=>i.st==='done'?'<span class="tag t-done">ส่งคืนแล้ว</span>':`<span class="tag t-${i.type}">${i.type==='lost'?'ของหาย':'ของที่เก็บได้'}</span>`;
const itemRow=i=>`<div class="card it" onclick="location.hash='item-${i.id}'">${thumb(i)}<div style="min-width:0">${tag(i)}<h3>${esc(i.title)}</h3><div class="mu">พบที่: ${esc(i.place)}<br>${fd(i.d)} ${ft(i.d)} น.</div></div></div>`;

let F={type:'lost',cat:'',title:'',desc:'',place:'',date:'',time:'',contact:'',img:''},q='',fc=-1,cm=new Date(),cs=dk(now),nt='all',scanImg='',msel='',leafletMap=null;

/* 1. Login */
function login(reg){
  return `<main><div class="logo"><div class="lg">🎒</div><h1>Smart<br>Lost & Found</h1><p>“ของหายได้คืน มศว”</p></div>
<div class="card">${reg?'<label class="l">ชื่อ-นามสกุล</label><input class="in" id="nm" autocomplete="name" placeholder="เช่น ธิดาวัลย์ รัตนพันธ์">':''}<label class="l">อีเมลมหาวิทยาลัย</label><input class="in" id="em" type="email" autocomplete="username" placeholder="name@g.swu.ac.th"><label class="l">รหัสผ่าน</label><input class="in" id="pw" type="password" autocomplete="${reg?'new-password':'current-password'}">${reg?'<label class="l">ยืนยันรหัสผ่าน</label><input class="in" id="pw2" type="password" autocomplete="new-password">':''}<div id="err" role="alert" style="color:var(--rd);font-size:13px;margin-top:8px"></div>
<button class="btn" onclick="doLogin(${reg?1:0})">${reg?'สมัครสมาชิก':'เข้าสู่ระบบ'}</button><button class="btn o" onclick="location.hash='${reg?'login':'register'}'">${reg?'มีบัญชีแล้ว เข้าสู่ระบบ':'สมัครสมาชิก'}</button></div>
<p class="mu" style="text-align:center">หรือเข้าสู่ระบบด้วย</p><div class="up" style="margin-top:8px"><label onclick="doLogin(2)"><i>🎓</i>อีเมล มศว</label></div></main>`;
}

function doLogin(m){
  const em=$('#em')?$('#em').value.trim():'';
  const nm=$('#nm')?$('#nm').value.trim():'';
  S.user={name:nm||'นิสิต มศว',email:em||'student@g.swu.ac.th',avatar:'👩‍🎓'};

  location.hash='home';

/* 2. Home */
function home(){
  const l=listHome();
  return `${bar('Smart Lost & Found มศว',0)}<main>
<input class="in" id="q" placeholder="🔎 ค้นหาของหาย / ของที่เก็บได้ ใน มศว" value="${esc(q)}" oninput="q=this.value;$('#lst').innerHTML=listHome()">
<div class="ban"><b>📢 ข่าวประชาสัมพันธ์ มศว</b>พบกระเป๋าสตางค์ที่สำนักหอสมุดกลาง สามารถติดต่อรับคืนได้ที่จุดบริการนิสิต<br><small>${fd(now)}</small></div>
<div style="margin-top:10px;text-align:right"><button class="btn o" style="display:inline-block;width:auto;padding:6px 14px;font-size:12px" onclick="simulateOtherUserPost()">🧪 จำลองคนอื่นโพสต์ (ทดสอบ DB Sync)</button></div>
<div class="grid">${CATS.map((c,i)=>`<button class="cat ${fc===i?'on':''}" onclick="fc=fc===${i}?-1:${i};render()"><span>${c[0]}</span>${c[1]}</button>`).join('')}</div>
<div class="hd">รายการของหายล่าสุด<a onclick="q='';fc=-1;render()">ดูทั้งหมด</a></div><div id="lst">${l}</div></main>`;
}

function listHome(){
  const w=q.toLowerCase().split(/\s+/).filter(Boolean);
  const a=S.items.filter(i=>(fc<0||i.cat===fc)&&w.every(x=>(i.title+i.desc+i.place+CATS[i.cat][1]).toLowerCase().includes(x))).sort((a,b)=>(a.st==='done')-(b.st==='done')||b.d-a.d);
  return a.length?a.map(itemRow).join(''):'<div class="mu" style="text-align:center;padding:30px">ไม่พบรายการ ลองเปลี่ยนคำค้นหา หรือสร้างประกาศใหม่</div>';
}

function simulateOtherUserPost(){
  const samplePlaces = Object.keys(PL);
  const randomPlace = samplePlaces[Math.floor(Math.random()*samplePlaces.length)];
  const newItem = {
    id: S.next++,
    type: Math.random() > 0.5 ? 'lost' : 'found',
    cat: Math.floor(Math.random()*8),
    title: 'ตัวอย่างของประกาศโดยผู้อื่น #' + S.next,
    desc: 'รายการนี้จำลองว่ามีเพื่อนนิสิตคนอื่นโพสต์เข้ามาในระบบ Real-time',
    place: randomPlace,
    d: Date.now(),
    contact: 'LINE: swu_friend',
    by: 'นิสิตเพื่อน มศว',
    owner: 'other@g.swu.ac.th',
    st: 'open'
  };
  S.items.unshift(newItem);
  S.notifications.unshift({
    id: Date.now(),
    type: newItem.type,
    title: `มีประกาศใหม่: ${newItem.title}`,
    desc: `สถานที่: ${newItem.place}`,
    time: Date.now(),
    read: false,
    target: `item-${newItem.id}`
  });
  save();
  render();
  toast('✅ จำลองการโพสต์เรียบร้อย ข้อมูลถูกซิงค์ไปยังผู้ใช้งานคนอื่นแล้ว');
}

/* 3. Post */
function post(){
  return `${bar('สร้างประกาศใหม่')}<main><div class="seg"><button class="${F.type==='lost'?'on':''}" onclick="sf();F.type='lost';render()">ประกาศของหาย</button><button class="${F.type==='found'?'on':''}" onclick="sf();F.type='found';render()">ประกาศของที่เก็บได้</button></div>
<label class="l">รูปภาพประกอบ</label><div class="up"><label><i>📷</i>ถ่ายรูป / เลือกรูป<input type="file" accept="image/*" capture="environment" hidden onchange="pk(this)"></label><label><i>⬆️</i>อัปโหลด<input type="file" accept="image/*" hidden onchange="pk(this)"></label></div>${F.img?`<img src="${F.img}" alt="" style="width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-top:8px">`:''}
<label class="l">หมวดหมู่ <i>*</i></label><select id="cat"><option value="">เลือกหมวดหมู่</option>${CATS.map((c,i)=>`<option value="${i}" ${F.cat==i&&F.cat!==''?'selected':''}>${c[0]} ${c[1]}</option>`).join('')}</select>
<label class="l">ชื่อสิ่งของ <i>*</i></label><input class="in" id="title" placeholder="เช่น บัตรนิสิต / กระเป๋าสตางค์สีดำ" value="${esc(F.title)}">
<label class="l">รายละเอียดสิ่งของ <i>*</i></label><textarea id="desc" rows="3" placeholder="ระบุยี่ห้อ สี จุดสังเกตเด่นๆ">${esc(F.desc)}</textarea>
<label class="l">สถานที่พบใน มศว <i>*</i></label><select id="place"><option value="">เลือกสถานที่ใน มศว</option>${Object.keys(PL).map(p=>`<option ${F.place===p?'selected':''}>${p}</option>`).join('')}</select>
<label class="l">วันที่พบ/หาย <i>*</i></label><div class="up"><input class="in" type="date" id="date" value="${F.date}"><input class="in" type="time" id="time" value="${F.time}"></div>
<label class="l">ช่องทางติดต่อ</label><input class="in" id="contact" placeholder="เบอร์โทร / Line ID" value="${esc(F.contact)}"><button class="btn" onclick="submitPost()">โพสต์ประกาศ</button></main>`;
}

function sf(){['cat','title','desc','place','date','time','contact'].forEach(k=>{const e=$('#'+k);if(e)F[k]=e.value})}
function pk(i){if(!i.files[0])return;sf();readImg(i.files[0],d=>{F.img=d;render()})}
function submitPost(){
  sf();
  if(F.cat===''||!F.title||!F.desc||!F.place||!F.date){toast('กรอกข้อมูลที่มี * ให้ครบถ้วน');return}
  const t=new Date(F.date+'T'+(F.time||'12:00')).getTime();
  const it={
    id:S.next++,
    type:F.type,
    cat:+F.cat,
    title:F.title,
    desc:F.desc,
    place:F.place,
    d:t,
    contact:F.contact||'ติดต่อผ่านแชทในระบบ',
    by:(S.user&&S.user.name)||'นิสิต มศว',
    owner:(S.user&&S.user.email)||'student@g.swu.ac.th',
    st:'open',
    img:F.img
  };
  S.items.unshift(it);
  save();
  F={type:F.type,cat:'',title:'',desc:'',place:'',date:'',time:'',contact:'',img:''};
  toast('โพสต์ประกาศสำเร็จ! ข้อมูลถูกบันทึกแล้ว');
  location.hash='item-'+it.id;
}

/* 4. Item Detail */
function item(id){
  const i=get(id);
  if(!i)return bar('ไม่พบรายการ',1)+'<main class="mu">รายการนี้ถูกลบแล้ว</main>';
  const sv=S.saved.includes(i.id),own=i.owner===(S.user&&S.user.email);
  return `<div class="hero" ${i.img?`style="background-image:url(${i.img})"`:''}>${i.img?'':CATS[i.cat][0]}<button class="ib" style="position:absolute;top:14px;left:14px" onclick="history.back()">‹</button></div><main>
<h2 style="font-size:20px;font-weight:600">${esc(i.title)} ${tag(i)}</h2>
<div class="row"><b>📂 หมวดหมู่</b>${CATS[i.cat][1]}</div>
<div class="row"><b>🕒 วันที่พบ</b>${fd(i.d)} เวลา ${ft(i.d)} น.</div>
<div class="row"><b>📍 สถานที่พบ</b>${esc(i.place)}</div>
<div class="card" style="margin-top:10px"><b>รายละเอียดเพิ่มเติม</b><p class="mu" style="margin-top:6px">${esc(i.desc)}</p></div>
<div class="card it"><div class="th" style="border-radius:50%;overflow:hidden">${userAvatarHeader(S.user)}</div><div><b>ผู้ประกาศ</b><div class="mu">${esc(i.by)} · นิสิต มศว</div><div class="mu">ติดต่อ: ${esc(i.contact)}</div></div></div>
<div class="up"><button class="btn" onclick="location.hash='chat-${i.id}'">💬 ส่งข้อความแชท</button><button class="btn o" onclick="tsv(${i.id})">${sv?'💙 บันทึกแล้ว':'🤍 บันทึก'}</button></div>
${own&&i.st==='open'?`<button class="btn g" onclick="dn(${i.id})">✅ ทำรายการสำเร็จ / คืนแล้ว</button>`:''}
${own?`<button class="btn o" style="color:var(--rd);border-color:var(--rd)" onclick="rm(${i.id})">ลบประกาศ</button>`:''}</main>`;
}
function tsv(id){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];save();render()}
function dn(id){get(id).st='done';save();toast('อัปเดตสถานะเป็นคืนแล้ว 🎉');render()}
function rm(id){if(!confirm('ยืนยันการลบประกาศนี้?'))return;S.items=S.items.filter(i=>i.id!==id);save();location.hash='home'}

/* 5. Chat */
function chat(id){
  const i=get(id);
  if(!i)return'';
  const m=S.chats[id]||(S.chats[id]=[{w:'o',t:'สวัสดีค่ะ สนใจเรื่อง '+i.title+' ค่ะ ยังอยู่ไหมคะ'}]);
  return `${bar('แชท: '+esc(i.by),1)}<div class="card it" style="margin:10px 14px 0" onclick="location.hash='item-${i.id}'">${thumb(i)}<div><b>${esc(i.title)}</b><div class="mu">พบที่: ${esc(i.place)}</div></div></div>
<div class="msgs" id="ms">${m.map(x=>`<div class="m ${x.w}">${esc(x.t)}</div>`).join('')}</div>
<div class="cb"><input class="in" id="cmsg" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key==='Enter')send(${id})"><button class="ib" style="background:var(--b);color:#fff" onclick="send(${id})">➤</button></div>`;
}
function send(id){
  const e=$('#cmsg'),t=e.value.trim();
  if(!t)return;
  S.chats[id].push({w:'me',t});
  save();
  render();
  setTimeout(()=>{
    S.chats[id].push({w:'o',t:'รับทราบค่ะ นัดรับได้ที่จุดบริการนิสิต อาคารกิจกรรมนิสิตนะคะ'});
    save();
    if(location.hash==='#chat-'+id)render();
  },800);
}

/* 6. Interactive Real SWU Map */
function map(){
  const sh=msel&&S.items.filter(i=>i.place===msel&&i.st==='open');
  return `${bar('แผนที่จริง มศว ประสานมิตร')}<main>
<div id="map-container"></div>
${msel?`<div class="hd">📍 สิ่งของที่พบ ณ ${msel}</div>${sh.length?sh.map(itemRow).join(''):'<p class="mu">ยังไม่มีสิ่งของแจ้งพบในจุดนี้</p>'}`:'<p class="mu" style="margin-top:10px">แตะหมุดบนแผนที่ real-world เพื่อดูรายการที่พบในแต่ละอาคาร</p>'}
<div class="hd">อาคารและสถานที่ทั้งหมดใน มศว</div>${Object.keys(PL).map(p=>`<div class="card" onclick="selectPlaceOnMap('${p}')" style="cursor:pointer">📍 <b>${p}</b> <span class="mu">· ${S.items.filter(i=>i.place===p&&i.st==='open').length} รายการ</span></div>`).join('')}</main>`;
}

function initLeafletMap(){
  const container = $('#map-container');
  if(!container) return;
  
  if(leafletMap) {
    leafletMap.remove();
    leafletMap = null;
  }
  
  leafletMap = L.map('map-container').setView(SWU_CENTER, 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(leafletMap);

  Object.entries(PL).forEach(([placeName, coords]) => {
    const count = S.items.filter(i=>i.place===placeName&&i.st==='open').length;
    const marker = L.marker(coords).addTo(leafletMap);
    marker.bindPopup(`<b>${placeName}</b><br>พบของหาย: ${count} รายการ`);
    marker.on('click', () => {
      msel = placeName;
      render();
    });
  });
}

function selectPlaceOnMap(p){
  msel = p;
  render();
  if(leafletMap && PL[p]){
    leafletMap.setView(PL[p], 18);
  }
}

/* 7. Notifications (Fixed & Interactive) */
function notif(){
  const notifs = S.notifications || [];
  return `${bar('การแจ้งเตือน',1)}<main>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
  <span class="mu">การแจ้งเตือนทั้งหมด (${notifs.length})</span>
  <a style="font-size:13px;color:var(--b);cursor:pointer" onclick="markAllNotificationsRead()">ทำเครื่องหมายอ่านแล้วทั้งหมด</a>
</div>
<div>
  ${notifs.length ? notifs.map(n => `
    <div class="notif-card ${n.read?'':'unread'}" onclick="clickNotif(${n.id}, '${n.target}')">
      <div style="font-size:26px">${n.type==='found'?'🎒':n.type==='chat'?'💬':'ℹ️'}</div>
      <div style="flex:1">
        <b style="font-size:14px">${esc(n.title)}</b>
        <div class="mu">${esc(n.desc)}</div>
        <div style="font-size:11px;color:var(--mu);margin-top:4px">${fd(n.time)} ${ft(n.time)} น.</div>
      </div>
    </div>
  `).join('') : '<p class="mu" style="text-align:center;padding:40px">ไม่มีการแจ้งเตือนในขณะนี้</p>'}
</div></main>`;
}

function clickNotif(id, target){
  const n = S.notifications.find(x=>x.id===id);
  if(n){ n.read = true; save(); }
  if(target){
    location.hash = target;
  } else {
    render();
  }
}

function markAllNotificationsRead(){
  if(S.notifications){
    S.notifications.forEach(n=>n.read=true);
    save();
    render();
    toast('ทำเครื่องหมายอ่านแล้วทั้งหมดเรียบร้อย');
  }
}

/* 8. Profile & Custom Avatar */
function me(){
  const u = S.user || {name:'นิสิต มศว', email:'student@g.swu.ac.th', avatar:'👩‍🎓'};
  return `${bar('โปรไฟล์ส่วนตัว',0)}<main>
<div class="card" style="text-align:center">
  <div class="av" onclick="openAvatarModal()">${userAvatarHeader(u)}</div>
  <button class="btn o" style="width:auto;display:inline-block;padding:4px 12px;font-size:12px;margin:0 0 10px" onclick="openAvatarModal()">✏️ เปลี่ยนรูปโปรไฟล์</button>
  <div><b style="font-size:18px">${esc(u.name)}</b></div>
  <div class="mu">นิสิต มศว · ${esc(u.email)}</div>
</div>
<div class="card stat">
  <div><b>${S.items.filter(i=>i.owner===u.email&&i.type==='lost').length}</b><span class="mu">ประกาศของหาย</span></div>
  <div><b>${S.items.filter(i=>i.owner===u.email&&i.type==='found').length}</b><span class="mu">ของที่เก็บได้</span></div>
  <div><b>${S.items.filter(i=>i.owner===u.email&&i.st==='done').length}</b><span class="mu">สำเสร็จแล้ว</span></div>
</div>
<div class="card">
  <div class="mn" onclick="location.hash='hist'"><i>📄</i><span>ประวัติประกาศของฉัน</span>›</div>
  <div class="mn" onclick="location.hash='saved'"><i>💙</i><span>รายการที่บันทึกไว้ (${S.saved.length})</span>›</div>
  <div class="mn" onclick="location.hash='verify'"><i>✅</i><span>การยืนยันตัวตน</span><span class="tag t-found">ยืนยันแล้ว</span></div>
  <div class="mn" onclick="location.hash='notif'"><i>🔔</i><span>การแจ้งเตือน</span>›</div>
</div></main>`;
}

function openAvatarModal(){
  const e=document.createElement('div');
  e.className='sheet';
  e.onclick=x=>{if(x.target===e)e.remove()};
  e.innerHTML=`<div>
    <div class="hd" style="margin-top:0">เลือกรูปโปรไฟล์ของคุณ</div>
    <label class="l">เลือกจาก Avatar Preset</label>
    <div class="avatar-preset-grid">
      ${AVATAR_PRESETS.map(a=>`<div class="avatar-option" onclick="setPresetAvatar('${a}')">${a}</div>`).join('')}
    </div>
    <label class="l">หรืออัปโหลดรูปภาพของตัวเอง</label>
    <div class="up" style="margin-top:8px">
      <label><i>📷</i>อัปโหลดรูปโปรไฟล์<input type="file" accept="image/*" hidden onchange="uploadCustomAvatar(this)"></label>
    </div>
    <button class="btn o" style="margin-top:14px" onclick="document.querySelector('.sheet').remove()">ยกเลิก</button>
  </div>`;
  document.body.appendChild(e);
}

function setPresetAvatar(a){
  S.user.avatar = a;
  save();
  document.querySelector('.sheet').remove();
  render();
  toast('เปลี่ยนรูปโปรไฟล์เรียบร้อยแล้ว');
}

function uploadCustomAvatar(input){
  if(input.files && input.files[0]){
    readImg(input.files[0], dataUrl => {
      S.user.avatar = dataUrl;
      save();
      const sheet = document.querySelector('.sheet');
      if(sheet) sheet.remove();
      render();
      toast('อัปโหลดรูปโปรไฟล์สำเร็จ!');
    });
  }
}

/* 9. Calendar */
function cal(){
  const y=cm.getFullYear(),mo=cm.getMonth(),first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate(),has=new Set(S.items.map(i=>dk(i.d)));
  let c=['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="h">${d}</div>`).join('')+'<span></span>'.repeat(first);
  for(let d=1;d<=dim;d++){
    const k=y+'-'+(mo+1)+'-'+d;
    c+=`<button class="${has.has(k)?'has':''} ${k===cs?'sel':''} ${k===dk(now)?'td':''}" onclick="cs='${k}';render()">${d}</button>`;
  }
  const dl=S.items.filter(i=>dk(i.d)===cs);
  return `${bar('ปฏิทินตามหาของ')}<main><div class="card"><div class="hd" style="margin-top:0"><button class="ib" onclick="cm=new Date(${y},${mo-1},1);render()">‹</button>${fd(cm,{month:'long',year:'numeric'})}<button class="ib" onclick="cm=new Date(${y},${mo+1},1);render()">›</button></div><div class="cal">${c}</div></div>
<div class="hd">รายการในวันที่เลือก</div>${dl.length?dl.map(itemRow).join(''):'<p class="mu">ไม่มีรายการในวันที่เลือก</p>'}</main>`;
}

const hist=()=>bar('ประวัติประกาศของฉัน',1)+'<main>'+(S.items.filter(i=>i.owner===(S.user&&S.user.email)).map(itemRow).join('')||'<p class="mu" style="text-align:center;padding:30px">ยังไม่มีประกาศของคุณ</p>')+'</main>';
const saved=()=>bar('รายการที่บันทึกไว้',1)+'<main>'+(S.items.filter(i=>S.saved.includes(i.id)).map(itemRow).join('')||'<p class="mu" style="text-align:center;padding:30px">ยังไม่มีรายการที่บันทึกไว้</p>')+'</main>';

/* Router & Core Navigation */
const NAV=[['home','🏠','หน้าหลัก'],['map','📍','แผนที่'],['post','+',''],['cal','📅','ปฏิทิน'],['me','👤','โปรไฟล์']];

function render(){
  const h=location.hash.slice(1)||'home', [r,...rest]=h.split('-'), a=rest.join('-');
  const P={login:()=>login(0),register:()=>login(1),home,post,map,cal,me,notif,hist,saved,item:()=>item(a),chat:()=>chat(a)};
  
  if(!S.user && !['login','register'].includes(r)){
    location.hash='login';
    return;
  }
  
  $('#v').innerHTML=(P[r]||home)();
  const showNav=['home','post','map','cal','me'].includes(r);
  $('#nv').style.display=showNav?'flex':'none';
  $('#nv').innerHTML=NAV.map(([k,i,l])=>k==='post'?`<button class="fab" onclick="location.hash='post'">+</button>`:`<button class="${r===k?'on':''}" onclick="location.hash='${k}'"><i>${i}</i>${l}</button>`).join('');

  if(r==='map'){
    setTimeout(initLeafletMap, 100);
  }
}

window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
